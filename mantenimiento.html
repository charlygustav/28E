                let hasUnlocked = false;
        function triggerUnlock() {
            if (hasUnlocked) return;
            hasUnlocked = true;

            if (elD) elD.textContent = '00';
            if (elH) elH.textContent = '00';
            if (elM) elM.textContent = '00';
            if (elS) elS.textContent = '00';

function tick() {
            const now = new Date();

            // Reloj y fecha en vivo de Venezuela
            if (elClock) {
                const parts = clockFormatter.formatToParts(now);
                const getP = (type) => parts.find(p => p.type === type)?.value || '';
                elClock.innerHTML = `<span class="clock-date">${getP('day')}.${getP('month')}.${getP('year')}</span><span class="clock-time"> — ${getP('hour')}:${getP('minute')}:${getP('second')}</span>`;
            }

            // Cuenta regresiva al lanzamiento
            const diff = TARGET_DATE.getTime() - now.getTime();

            if (diff <= 0) {
                triggerUnlock();
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);

            if (elD) elD.textContent = String(d).padStart(2, '0');
            if (elH) elH.textContent = String(h).padStart(2, '0');
            if (elM) elM.textContent = String(m).padStart(2, '0');
            if (elS) elS.textContent = String(s).padStart(2, '0');

        onValue(ref(db, '.info/serverTimeOffset'), snap => {

        });

        function findTrackIndex(src) {
            if (!src) return 0;
            const idx = radioTracks.findIndex(t => t.src === src || new URL(t.src, document.baseURI).href === src);
            return idx !== -1 ? idx : 0;
        }

        function resolveLiveTrack(startTrackSrc, startTimeMs, nowMs) {
            let idx = findTrackIndex(startTrackSrc);
            let elapsed = Math.max(0, (nowMs - startTimeMs) / 1000);

            while (elapsed >= radioTracks[idx].duration) {
                elapsed -= radioTracks[idx].duration;
                idx = (idx + 1) % radioTracks.length;
            }
            return {
                track: radioTracks[idx],
                idx: idx,
                seekTime: elapsed,
                virtualStartTime: nowMs - Math.round(elapsed * 1000)
            };
        }

        function preloadNextTrack(idx) {
            if (idx < 0 || !radioTracks.length) return;
            const nextTrack = radioTracks[(idx + 1) % radioTracks.length];
            if (nextTrack && nextTrack.src) {
                const targetUrl = new URL(nextTrack.src, document.baseURI).href;
                if (nextAudioPreloader.src !== targetUrl) {
                    nextAudioPreloader.src = nextTrack.src;
                    nextAudioPreloader.load();
                }
            }
        }

        function loadAndPlayTrack(idx, seekTime = 0, allowSeek = false) {
            const track = radioTracks[idx];
            if (!track || !track.src) return;

            currentTrackIdx = idx;
            if (info) {
                info.innerHTML = `<span class="song-name">${track.title}</span><span class="song-artist"> — ${track.artist}</span>`;
            }
            preloadNextTrack(idx);

            if (activeMetaHandler) {
                audio.removeEventListener('loadedmetadata', activeMetaHandler);
                activeMetaHandler = null;
            }

            const targetUrl = new URL(track.src, document.baseURI).href;
            if (audio.src !== targetUrl) {
                audio.src = track.src;
                audio.load();

                activeMetaHandler = () => {
                    if (activeMetaHandler) {
                        audio.removeEventListener('loadedmetadata', activeMetaHandler);
                        activeMetaHandler = null;
                    }
                    if (allowSeek && seekTime > 3 && audio.duration && seekTime < audio.duration - 6) {
                        try { audio.currentTime = seekTime; } catch (_) { }
                    }
                    audio.play().catch(() => { });
                };
                audio.addEventListener('loadedmetadata', activeMetaHandler);
            } else if (audio.paused) {
                audio.play().catch(() => { });
            }
        }

        function syncTrack(state) {
            if (!state) return;
            const now = Date.now() + serverTimeOffset;
            const startTime = state.startTime || now;

            if (state.isPlaying === false) {
                currentRadioState = state;
                audio.pause();
                return;
            }

            if (hasInitialSynced && state.source === 'dj' && state.startTime && state.startTime !== lastDjStartTime) {
                lastDjStartTime = state.startTime;
                currentRadioState = state;
                loadAndPlayTrack(findTrackIndex(state.src), 0, false);
                return;
            }

            if (hasInitialSynced) {
                const wasPaused = currentRadioState && currentRadioState.isPlaying === false && state.isPlaying === true;
                currentRadioState = state;
                if (wasPaused && audio.paused) {
                    audio.play().catch(() => { });
                }
                return;
            }

            hasInitialSynced = true;
            if (state.source === 'dj' && state.startTime) {
                lastDjStartTime = state.startTime;
            }
            currentRadioState = state;

            const resolved = resolveLiveTrack(state.src, startTime, now);
            let bootIdx = resolved.idx;
            let bootSeek = resolved.seekTime;
            if (bootSeek >= radioTracks[bootIdx].duration - 8) {
                bootIdx = (bootIdx + 1) % radioTracks.length;
                bootSeek = 0;
            }
            loadAndPlayTrack(bootIdx, bootSeek, bootSeek > 3);
        }

        audio.addEventListener('ended', () => {
            setTimeout(() => {
                const nextIdx = ((currentTrackIdx >= 0 ? currentTrackIdx : 0) + 1) % radioTracks.length;
                loadAndPlayTrack(nextIdx, 0, false);
            }, 200);
        });

        onValue(ref(db, 'radio_state/current'), snap => {
            const state = snap.val();
            syncTrack(state);
        });

        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/current.json')
            .then(res => res.json())
            .then(state => {
                if (!hasInitialSynced && state) syncTrack(state);
            })
            .catch(() => { });

        // ── 3. Cintillo de Noticias en Vivo ──
        const elNewsCat = document.getElementById('news-cat');
        const elNewsTitle = document.getElementById('news-title');

        let newsList = [
            { category: "ACTUALIDAD", title: "Transmisión 24/7 en directo camino a la apertura de la web 28E" },
            { category: "MÚSICA", title: "Nuevas producciones y lanzamientos globales marcan la escena urbana" }
        ];
        let newsIdx = 0;

        function renderNewsItem(item) {
            if (!item || !elNewsTitle) return;
            elNewsTitle.style.opacity = '0';

            setTimeout(() => {
                if (elNewsCat) elNewsCat.textContent = item.category || 'NOTICIAS';
                elNewsTitle.textContent = item.title || '';
                elNewsTitle.style.opacity = '1';
            }, 300);
        }

        function cycleNews() {
            if (!newsList || newsList.length === 0) return;
            newsIdx = (newsIdx + 1) % newsList.length;
            renderNewsItem(newsList[newsIdx]);
        }

        onValue(ref(db, 'radio_state/news/items'), snap => {
            const data = snap.val();
            if (Array.isArray(data) && data.length > 0) {
                newsList = data;
                renderNewsItem(newsList[newsIdx % newsList.length]);
            }
        });

        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/news/items.json')
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    newsList = data;
                    renderNewsItem(newsList[newsIdx % newsList.length]);
                }
            })
            .catch(() => { });

        setInterval(cycleNews, 9000);
        renderNewsItem(newsList[0]);

        // Manejador global de clic para iniciar audio si el navegador bloquea autoplay
        window.triggerAudio = function () {
            if (audio.paused) {
                audio.play().then(() => {
                }).catch(() => { });
            }
        };

        window.addEventListener('click', triggerAudio, { passive: true });
        window.addEventListener('touchstart', triggerAudio, { passive: true });

        // Intentar autoplay de inmediato
        setTimeout(() => {
            audio.play().then(() => {
            }).catch(() => {
            });
        }, 800);
    </script>
</body>
