<head>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --tulip-400: #f472b6;
      --tulip-500: #ec4899;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --bg: #09090b;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f4f4f5;
      --muted: #71717a;
    }

    @keyframes auroraShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #09090b, #1a0a1e, #0d0a1a, #1a0d06, #0d1a0a, #09090b);
      background-size: 400% 400%;
      animation: auroraShift 18s ease infinite;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    
    
    
    
    /* ═══ Reset & Body ═══ */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #030305;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    /* ═══ Canvas Espectáculo ═══ */
    #particle-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* ═══ Contenedor Principal (Ordenado) ═══ */
    .spectacle-layout {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* Let clicks pass to canvas */
    }

    /* ═══ Elementos ═══ */
    .spectacle-content {
      pointer-events: auto; /* Re-enable clicks for content */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, transparent 70%);
      border-radius: 50%;
    }

    .sp-logo {
      font-size: 1rem; font-weight: 900; letter-spacing: 0.2em;
      color: var(--tulip-400); margin-bottom: 2rem;
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--tulip-500);
    }

    .sp-title {
      font-size: clamp(2.5rem, 5vw, 5rem);
      font-weight: 200; letter-spacing: 0.15em;
      margin-bottom: 1rem; line-height: 1.1;
      text-transform: uppercase;
      background: linear-gradient(to right, #fff, #a1a1aa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sp-subtitle {
      font-family: 'Merriweather', serif;
      font-style: italic; font-size: 1.1rem;
      color: #d4d4d8; max-width: 500px; line-height: 1.6;
      margin-bottom: 3rem;
    }

    /* Línea de carga animada */
    .sp-loader {
      width: 200px; height: 1px;
      background: rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
      margin-bottom: 3rem;
    }
    .sp-loader::after {
      content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 40%;
      background: var(--tulip-400);
      box-shadow: 0 0 10px var(--tulip-500);
      animation: spLoad 2s ease-in-out infinite alternate;
    }
    @keyframes spLoad { 0% { left: -40%; } 100% { left: 100%; } }

    /* Pill Music Player Rediseñado */
    .sp-music-container {
      width: 100%;
      display: flex; justify-content: center;
    }
    .mini-player.sp-pill {
      position: relative; top: auto; right: auto;
      width: auto; min-width: 280px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 0.5rem 1rem 0.5rem 0.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: border-color 0.3s ease;
    }
    .sp-pill:hover { border-color: rgba(255, 255, 255, 0.2); }
    .sp-pill .mini-player-top { gap: 1rem; }
    .sp-pill .mp-cover { width: 45px; height: 45px; border-radius: 50%; }
    .sp-pill .mp-progress-wrap { display: none; }
    .sp-pill .mp-info { text-align: left; }

    /* Contador Oculto (Si el mantenimiento es programado) */
    .sp-countdown {
      display: flex; gap: 2rem; justify-content: center; margin-top: 1rem;
    }
    .sp-cd-item { text-align: center; }
    .sp-cd-num { font-size: 3rem; font-weight: 200; color: #fff; line-height: 1; }
    .sp-cd-lbl { font-size: 0.7rem; color: var(--tulip-400); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.5rem; display: block; }
\n\n    /* Footer strip */
    .footer-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

    .footer-strip a:hover {
      color: var(--tulip-400);

    /* ═══ Responsive: una columna en mobile ═══ */
    @media (max-width: 768px) {

      html,
      body {
        overflow: auto;

        grid-template-columns: 1fr;

    .mp-cover {

    .mp-cover-icon {

    .mp-ctrl {

      border-radius: 50%;

      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;

    .mp-ctrl:active {

    .mp-ctrl svg {

    }

    .mp-ctrl-play {

    /* Progress bar */
    .mp-progress-wrap {

    .mp-time {

    @media (max-width: 768px) {
      .mini-player {
        left: .75rem;
        right: .75rem;
        width: auto;
        top: .75rem;
      }
    }
  </style>

  <script>
    // ── Año ──
    document.getElementById('yr').textContent = new Date().getFullYear();






    
    
    // ── Partículas Estelares (Stardust) ──
    const starContainer = document.getElementById('stardust-container');
    for(let i=0; i<40; i++){
      let star = document.createElement('div');
      star.className = 'stardust';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      starContainer.appendChild(star);
      
      gsap.to(star, {
        y: '-=100',
        opacity: Math.random() * 0.5 + 0.1,
        duration: Math.random() * 5 + 5,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut',
        delay: Math.random() * 5
      });
    }

    
    
    // ── Espectáculo de Partículas Interactivas (Canvas) ──
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let mouse = { x: null, y: null, radius: (canvas.height/80) * (canvas.width/80) };

    window.addEventListener('mousemove', function(event) {
      mouse.x = event.x; mouse.y = event.y;
    });

    class Particle {
      constructor(x, y, directionX, directionY, size, color) {
        this.x = x; this.y = y;
        this.directionX = directionX; this.directionY = directionY;
        this.size = size; this.color = color;
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        ctx.fillStyle = this.color; ctx.fill();
      }
      update() {
        if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
        if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

        // Interactive mouse collision
        let dx = mouse.x - this.x; let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < mouse.radius + this.size){
          if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 10;
          if (mouse.x > this.x && this.x > this.size * 10) this.x -= 10;
          if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 10;
          if (mouse.y > this.y && this.y > this.size * 10) this.y -= 10;
        }
        this.x += this.directionX; this.y += this.directionY;
        this.draw();
      }
    }

    function initParticles() {
      particlesArray = [];
      let numberOfParticles = (canvas.height * canvas.width) / 9000;
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 2) + 1;
        let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
        let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
        let directionX = (Math.random() * 1) - 0.5;
        let directionY = (Math.random() * 1) - 0.5;
        let color = '#ec4899'; // tulip-500
        particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
      }
    }

    function animateParticles() {
      requestAnimationFrame(animateParticles);
      ctx.clearRect(0,0,innerWidth, innerHeight);
      for (let i = 0; i < particlesArray.length; i++) particlesArray[i].update();
      connectParticles();
    }

    function connectParticles() {
      let opacityValue = 1;
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
          if (distance < (canvas.width/7) * (canvas.height/7)) {
            opacityValue = 1 - (distance/20000);
            ctx.strokeStyle = 'rgba(236, 72, 153,' + opacityValue + ')';
            ctx.lineWidth = 1; ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    window.addEventListener('resize', function(){
      canvas.width = innerWidth; canvas.height = innerHeight;
      mouse.radius = ((canvas.height/80) * (canvas.height/80));
      initParticles();
    });

    initParticles(); animateParticles();

    // ── GSAP Timeline ──
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.from('.gs-item', { y: 30, opacity: 0, duration: 1.2, stagger: 0.2 }, 0.5)
      .from('.footer-strip', { opacity: 0, y: 10, duration: 1 }, 1.5);
\n\n    // GSAP: reveal the mini player
    gsap.set('#mini-player', { opacity: 0, y: -20 });
    gsap.to('#mini-player', { opacity: 1, y: 0, duration: .6, delay: 1.3, ease: 'power3.out', onComplete: () => player.classList.add('visible') });

    // Admin Panel: Detectar cuando se desactiva el mantenimiento
    let countdownInterval;

    async function checkMaintenanceStatus() {
      try {
        // Siempre leer DIRECTO desde Firebase (nunca usar caché local para evitar loops)
        const _FB = 'https://yaire-591ca-default-rtdb.firebaseio.com/config.json';
        const res = await fetch(_FB + '?nocache=' + Date.now());
        if (!res.ok) return; // Si no hay red, no hacer nada
        const cfg = await res.json();
        if (!cfg) return;

        // Guardar en localStorage para que index.html también vea el estado actualizado
        const safeCfg = { ...cfg };
        localStorage.setItem('yaire_config', JSON.stringify(safeCfg));

        // Si mantenimiento está desactivado → redirigir al index
        if (!cfg.mantenimiento) {
          // Limpiar cualquier caché vieja para que index.html no rebote de vuelta
          localStorage.removeItem('yaire_config');
          window.location.href = 'index.html';
          return;
        }

        // Mantenimiento activo → decidir qué mostrar
        
        // Mostrar mensaje personalizado si existe
        const subtitleEl = document.getElementById('maint-subtitle');
        if (cfg.maintMsg && cfg.maintMsg.trim() !== '') {
          subtitleEl.textContent = cfg.maintMsg;
        } else {
          subtitleEl.innerHTML = 'Estamos puliendo cada detalle para que todo luzca perfecto para <em>ti</em>.&nbsp; Gracias por tu paciencia. 🌸';
        }

        if (cfg.maintType === 'scheduled' && cfg.maintDate) {
          document.getElementById('visual-center').style.display = 'none';
          document.getElementById('visual-progress').style.display = 'none';
          document.getElementById('visual-countdown').style.display = 'block';

          const targetDate = new Date(cfg.maintDate).getTime();

          if (countdownInterval) clearInterval(countdownInterval);

          const updateTimer = async () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
              clearInterval(countdownInterval);
              // Desactivar mantenimiento en Firebase
              const updatedCfg = { ...cfg, mantenimiento: false };
              delete updatedCfg.ghToken;
              delete updatedCfg.ghRepo;
              await fetch('https://yaire-591ca-default-rtdb.firebaseio.com/config.json', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedCfg)
              }).catch(() => {});
              localStorage.removeItem('yaire_config');
              window.location.href = 'index.html';
              return;
            }

            const days    = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent  = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent  = String(minutes).padStart(2, '0');
            document.getElementById('cd-secs').textContent  = String(seconds).padStart(2, '0');
          };

          updateTimer();
          countdownInterval = setInterval(updateTimer, 1000);

        } else {
          // Mantenimiento indefinido → mostrar globo animado
          document.getElementById('visual-center').style.display = 'flex';
          document.getElementById('visual-progress').style.display = 'block';
          document.getElementById('visual-countdown').style.display = 'none';
          if (countdownInterval) clearInterval(countdownInterval);
        }

      } catch (e) { /* sin red, no hacer nada */ }
    }

    // Polling de respaldo + Firebase SSE para tiempo real
    checkMaintenanceStatus();
    setInterval(checkMaintenanceStatus, 3000);

    window.addEventListener('storage', (e) => {
      if (e.key === 'yaire_reload' || e.key === 'yaire_config') {
        checkMaintenanceStatus();
      }
    });
  </script>
</body>

</html>
