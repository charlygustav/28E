<html lang="es" class="dark">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/x-icon" href="tulip.ico?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Merriweather:ital@1&display=swap">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --tulip-400: #f472b6;
      --tulip-500: #ec4899;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --bg: #09090b;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f4f4f5;
      --muted: #71717a;
    }

    @keyframes auroraShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #09090b, #1a0a1e, #0d0a1a, #1a0d06, #0d1a0a, #09090b);
      background-size: 400% 400%;
      animation: auroraShift 18s ease infinite;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    
    
    
    /* ═══ Orbs & Background ═══ */
    body {
      background: #050505;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* ═══ Zen Glass Concept ═══ */
    .zen-background {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .zen-orb {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw; height: 70vw;
      max-width: 900px; max-height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(245,158,11,0.05) 100%);
      filter: blur(120px);
      animation: zenBreathe 12s ease-in-out infinite alternate;
    }

    @keyframes zenBreathe {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    .zen-layout {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .zen-card {
      background: rgba(15, 15, 18, 0.4);
      backdrop-filter: blur(40px) saturate(1.2);
      -webkit-backdrop-filter: blur(40px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 32px;
      padding: 4rem 3rem;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 
        0 40px 80px -20px rgba(0,0,0,0.5), 
        inset 0 1px 0 rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    .zen-logo {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-transform: uppercase;
    }

    .zen-dot {
      width: 6px; height: 6px;
      background: var(--tulip-400);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--tulip-400);
      animation: pulseGlow 2s infinite alternate;
    }

    .zen-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: #fff;
      margin-bottom: 1rem;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .zen-subtitle {
      font-family: 'Merriweather', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #a1a1aa;
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 3.5rem;
      letter-spacing: 0.03em;
    }

    /* Concept Line */
    .zen-concept-line {
      width: 2px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--tulip-500), transparent);
      margin-bottom: 3rem;
      opacity: 0.5;
      animation: lineBreathe 3s ease-in-out infinite alternate;
    }

    @keyframes lineBreathe {
      0% { height: 20px; opacity: 0.2; }
      100% { height: 50px; opacity: 0.8; }
    }
    @keyframes pulseGlow { 0% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Pill Music Player */
    .zen-music-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .mini-player.zen-pill {
      position: relative;
      top: 0; right: 0;
      transform: none !important; /* GSAP will animate parent opacity */
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      padding: 0.5rem 1.2rem 0.5rem 0.5rem;
      box-shadow: none;
      opacity: 1;
    }

    .zen-pill .mini-player-top {
      gap: 1rem;
    }

    .zen-pill .mp-cover {
      width: 42px; height: 42px;
      border-radius: 50%;
    }

    .zen-pill .mp-progress-wrap {
      display: none; /* Hide progress bar for absolute minimalism */
    }

    .zen-pill .mp-info {
      text-align: left;
    }

    .zen-pill .mp-title { font-size: 0.85rem; }
    .zen-pill .mp-artist { font-size: 0.65rem; }

    /* Progress Indicators (Minimalist version of status) */
    .zen-status-dots {
      display: flex;
      gap: 1rem;
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
    }
    .zen-status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #52525b;
    }
    .zen-status-dot.active {
      background: var(--tulip-400);
      box-shadow: 0 0 8px var(--tulip-400);
    }
\n\n    /* Footer strip */
    .footer-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 1px solid var(--border);
      background: rgba(9, 9, 11, .7);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 3rem;
      font-size: .68rem;
      color: var(--muted);
      z-index: 10;
    }

    .footer-strip a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-strip a:hover {
      color: var(--tulip-400);
    }

    /* ═══ Responsive: una columna en mobile ═══ */
    @media (max-width: 768px) {

      html,
      body {
        overflow: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: 100dvh;
      }

      .col-left {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 2rem 1.5rem;
      }

      .col-right {
        padding: 2rem 1.5rem;
      }

      .clock-time {
        font-size: 3.5rem;
      }

      .status-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-strip {
        padding: .6rem 1.5rem;
      }
    }

    /* ── Mini Player ── */
    .mini-player {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 60;
      width: 310px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .07);

    }

    .mini-player-top {

      gap: .75rem;
    }

    .mp-cover {
      width: 40px;
      height: 40px;
      border-radius: .6rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;

      overflow: hidden;
    }

    .mp-cover-bg {
      position: absolute;

      transition: opacity .4s ease;
    }

    .mp-cover-icon {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .6));
    }

    .mp-cover.spinning .mp-cover-icon {
      animation: coverSpin 4s linear infinite;
    }

    @keyframes coverSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .mp-info {
      flex: 1;
      min-width: 0;
    }

    .mp-title {
      font-size: .8rem;
      font-weight: 700;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .mp-artist {
      font-size: .65rem;
      font-weight: 500;
      color: #71717a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mp-controls {
      display: flex;
      align-items: center;
      gap: .15rem;
      flex-shrink: 0;
    }

    .mp-ctrl {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .mp-ctrl:hover {
      background: rgba(255, 255, 255, .08);
    }

    .mp-ctrl:active {
      transform: scale(0.9);
    }

    .mp-ctrl svg {
      width: 14px;
      height: 14px;
      fill: #a1a1aa;
      transition: fill .2s;
    }

    .mp-ctrl:hover svg {
      fill: #f4f4f5;
    }

    .mp-ctrl-play {
      width: 38px;
      height: 38px;
      background: var(--tulip-500);
      border-radius: 50%;
    }

    .mp-ctrl-play:hover {
      background: var(--tulip-400);
    }

    .mp-ctrl-play svg {
      fill: #fff;
      width: 16px;
      height: 16px;
    }

    .mp-ctrl-play:hover svg {
      fill: #fff;
    }

    /* Progress bar */
    .mp-progress-wrap {
      margin-top: .55rem;
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    .mp-time {
      font-size: .55rem;
      font-weight: 600;
      color: #52525b;
      min-width: 28px;
      font-variant-numeric: tabular-nums;
    }

    .mp-time-end {
      text-align: right;
    }

    .mp-progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, .08);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .mp-progress-track:hover {

    }

    .mp-progress-fill {

      background: linear-gradient(90deg, var(--tulip-500), var(--amber-400));

    }

    @media (max-width: 768px) {
      .mini-player {
        left: .75rem;
        right: .75rem;
        width: auto;
        top: .75rem;
      }
    }
  </style>

  <script>
    // ── Año ──
    document.getElementById('yr').textContent = new Date().getFullYear();






    
    
    // ── Partículas Estelares (Stardust) ──
    const starContainer = document.getElementById('stardust-container');
    for(let i=0; i<40; i++){
      let star = document.createElement('div');
      star.className = 'stardust';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      starContainer.appendChild(star);
      
      gsap.to(star, {
        y: '-=100',
        opacity: Math.random() * 0.5 + 0.1,
        duration: Math.random() * 5 + 5,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut',
        delay: Math.random() * 5
      });
    }

    
    // ── GSAP Zen Timeline ──
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl
      // 1. El orbe de fondo aparece suavemente
      .from('.gs-orb', { opacity: 0, scale: 0.8, duration: 3, ease: 'sine.inOut' }, 0)
      
      // 2. La tarjeta Zen asciende y se revela
      .from('.gs-card', { y: 40, opacity: 0, duration: 1.5 }, 0.5)
      
      // 3. Elementos internos aparecen en cascada
      .from('.gs-item', { y: 15, opacity: 0, duration: 1, stagger: 0.15 }, 1.0)
      
      // 4. Footer
      .from('.footer-strip', { opacity: 0, y: 10, duration: 1 }, 1.5);
\n\n    // GSAP: reveal the mini player
    gsap.set('#mini-player', { opacity: 0, y: -20 });
    gsap.to('#mini-player', { opacity: 1, y: 0, duration: .6, delay: 1.3, ease: 'power3.out', onComplete: () => player.classList.add('visible') });

    // Admin Panel: Detectar cuando se desactiva el mantenimiento
    let countdownInterval;

    async function checkMaintenanceStatus() {
      try {
        // Siempre leer DIRECTO desde Firebase (nunca usar caché local para evitar loops)
        const _FB = 'https://yaire-591ca-default-rtdb.firebaseio.com/config.json';
        const res = await fetch(_FB + '?nocache=' + Date.now());
        if (!res.ok) return; // Si no hay red, no hacer nada
        const cfg = await res.json();
        if (!cfg) return;

        // Guardar en localStorage para que index.html también vea el estado actualizado
        const safeCfg = { ...cfg };
        localStorage.setItem('yaire_config', JSON.stringify(safeCfg));

        // Si mantenimiento está desactivado → redirigir al index
        if (!cfg.mantenimiento) {
          // Limpiar cualquier caché vieja para que index.html no rebote de vuelta
          localStorage.removeItem('yaire_config');
          window.location.href = 'index.html';
          return;
        }

        // Mantenimiento activo → decidir qué mostrar
        
        // Mostrar mensaje personalizado si existe
        const subtitleEl = document.getElementById('maint-subtitle');
        if (cfg.maintMsg && cfg.maintMsg.trim() !== '') {
          subtitleEl.textContent = cfg.maintMsg;
        } else {
          subtitleEl.innerHTML = 'Estamos puliendo cada detalle para que todo luzca perfecto para <em>ti</em>.&nbsp; Gracias por tu paciencia. 🌸';
        }

        if (cfg.maintType === 'scheduled' && cfg.maintDate) {
          document.getElementById('visual-center').style.display = 'none';
          document.getElementById('visual-progress').style.display = 'none';
          document.getElementById('visual-countdown').style.display = 'block';

          const targetDate = new Date(cfg.maintDate).getTime();

          if (countdownInterval) clearInterval(countdownInterval);

          const updateTimer = async () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
              clearInterval(countdownInterval);
              // Desactivar mantenimiento en Firebase
              const updatedCfg = { ...cfg, mantenimiento: false };
              delete updatedCfg.ghToken;
              delete updatedCfg.ghRepo;
              await fetch('https://yaire-591ca-default-rtdb.firebaseio.com/config.json', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedCfg)
              }).catch(() => {});
              localStorage.removeItem('yaire_config');
              window.location.href = 'index.html';
              return;
            }

            const days    = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent  = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent  = String(minutes).padStart(2, '0');
            document.getElementById('cd-secs').textContent  = String(seconds).padStart(2, '0');
          };

          updateTimer();
          countdownInterval = setInterval(updateTimer, 1000);

        } else {
          // Mantenimiento indefinido → mostrar globo animado
          document.getElementById('visual-center').style.display = 'flex';
          document.getElementById('visual-progress').style.display = 'block';
          document.getElementById('visual-countdown').style.display = 'none';
          if (countdownInterval) clearInterval(countdownInterval);
        }

      } catch (e) { /* sin red, no hacer nada */ }
    }

    // Polling de respaldo + Firebase SSE para tiempo real
    checkMaintenanceStatus();
    setInterval(checkMaintenanceStatus, 3000);

    window.addEventListener('storage', (e) => {
      if (e.key === 'yaire_reload' || e.key === 'yaire_config') {
        checkMaintenanceStatus();
      }
    });
  </script>
</body>
