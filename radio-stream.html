        const clockFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Caracas',
            weekday: 'short',
            day: 'numeric',
            month: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true

        const WEEKDAYS_ES = { Sun: 'Dom', Mon: 'Lun', Tue: 'Mar', Wed: 'Mié', Thu: 'Jue', Fri: 'Vie', Sat: 'Sáb' };
        const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

        function tick() {
            const now = new Date();

            // Reloj y fecha en vivo de Venezuela (Estilo Apple / macOS: Vie, 6 nov · 8:49 PM)
            if (elClock) {
                const parts = clockFormatter.formatToParts(now);
                const getP = (type) => parts.find(p => p.type === type)?.value || '';
                const wDay = WEEKDAYS_ES[getP('weekday')] || getP('weekday');
                const dayNum = getP('day');
                const monthName = MONTHS_ES[(parseInt(getP('month'), 10) || 1) - 1];
                const hourVal = getP('hour');
                const minVal = getP('minute');
                const dayPeriod = (getP('dayPeriod') || '').toUpperCase().replace(/\./g, '').replace(/\s+/g, '');
                elClock.innerHTML = `<span class="clock-date">${wDay}, ${dayNum} ${monthName}</span><span class="clock-sep"> · </span><span class="clock-time">${hourVal}:${minVal} ${dayPeriod}</span>`;
            }

            // Cuenta regresiva al lanzamiento
            const diff = TARGET_DATE.getTime() - now.getTime();

            if (diff <= 0) {
                if (elD) elD.textContent = '00';
                if (elH) elH.textContent = '00';
                if (elM) elM.textContent = '00';
                if (elS) elS.textContent = '00';
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);

            if (elD) elD.textContent = String(d).padStart(2, '0');
            if (elH) elH.textContent = String(h).padStart(2, '0');
            if (elM) elM.textContent = String(m).padStart(2, '0');
            if (elS) elS.textContent = String(s).padStart(2, '0');
        }

            { title: "Fly Away", artist: "Otis McDonald", src: "radio/Fly Away - Otis McDonald.mp3", duration: 165.1 },
            { title: "Wait for You", artist: "Otis McDonald", src: "radio/Otis McDonald - Wait for You.mp3", duration: 192.5 },
            { title: "Stay", artist: "Otis McDonald", src: "radio/Stay - Otis McDonald.mp3", duration: 118.6 },
            { title: "Eres", artist: "Rodezel", src: "radio/Eres - Rodezel.mp3", duration: 200.0 },
            { title: "Other Way", artist: "Otis McDonald", src: "radio/Other Way - Otis McDonald.mp3", duration: 114.7 },
            { title: "Gold", artist: "Ooyy, Janset", src: "radio/ES_Gold - Ooyy.mp3", duration: 187.8 },
            { title: "Ever Felt, Pt. 2", artist: "Otis McDonald", src: "radio/Otis McDonald - Ever Felt, Pt. 2.mp3", duration: 140.0 },
            { title: "Behind These Closed Doors", artist: "Otis McDonald", src: "radio/Behind Closed Doors - Otis McDonald.mp3", duration: 128.5 },
            { title: "A Legacy Endures", artist: "Otis McDonald", src: "sounds/ost/Otis McDonald - A Legacy Endures.mp3", duration: 299.7 },
            { title: "Good Time", artist: "Otis McDonald", src: "radio/Otis McDonald - Good Time.mp3", duration: 269.8 },
            { title: "A Legacy Lived", artist: "Otis McDonald", src: "sounds/ost/Otis McDonald - A Legacy Lived.mp3", duration: 307.2 },
            { title: "ELEVATION", artist: "BLUE STEEL", src: "radio/ES_ELEVATION - BLUE STEEL.mp3", duration: 192.4 },
            { title: "A Legacy Understood", artist: "Otis McDonald", src: "sounds/ost/Otis McDonald - A Legacy Understood.mp3", duration: 404.4 },
            { title: "Don't Show Your Face", artist: "Otis McDonald", src: "radio/Otis McDonald - Don't Show Your Face.mp3", duration: 151.4 },
            { title: "LUDICROUS", artist: "BLUE STEEL", src: "radio/ES_LUDICROUS - BLUE STEEL.mp3", duration: 149.6 },
            { title: "It Slowly Started to Fade Away", artist: "Otis McDonald", src: "sounds/ost/Otis McDonald - It Slowly Started to Fade Away.mp3", duration: 506.4 },
            { title: "Holiday (reprise)", artist: "Otis McDonald", src: "radio/Otis McDonald - Holiday (reprise).mp3", duration: 169.6 }
        ];

        const audio = document.getElementById('audio-elem');
        const info = document.getElementById('music-info');
        const nextAudioPreloader = new Audio();
        nextAudioPreloader.preload = 'auto';

        let serverTimeOffset = 0;
        let currentRadioState = null;
        let currentTrackIdx = -1;
        let isTransitioning = false;
        let hasInitialSynced = false;
        let lastDjStartTime = 0;
        let activeMetaHandler = null;
        let endedTimer = null;

        onValue(ref(db, '.info/serverTimeOffset'), snap => {
            serverTimeOffset = snap.val() || 0;
        });

        function findTrackIndex(src) {
            if (!src) return 0;
            const idx = radioTracks.findIndex(t => t.src === src || new URL(t.src, document.baseURI).href === src);
            return idx !== -1 ? idx : 0;
        }

        // Resuelve qué canción y segundo exacto corresponden a este milisegundo real (solo para el arranque inicial)
        function resolveLiveTrack(startTrackSrc, startTimeMs, nowMs) {
            let idx = findTrackIndex(startTrackSrc);
            let elapsed = Math.max(0, (nowMs - startTimeMs) / 1000);

            while (elapsed >= radioTracks[idx].duration) {
                elapsed -= radioTracks[idx].duration;
                idx = (idx + 1) % radioTracks.length;
            }
            return {
                track: radioTracks[idx],
                idx: idx,
                seekTime: elapsed,
                virtualStartTime: nowMs - Math.round(elapsed * 1000)
            };
        }

        function preloadNextTrack(idx) {
            if (idx < 0 || !radioTracks.length) return;
            const nextTrack = radioTracks[(idx + 1) % radioTracks.length];
            if (nextTrack && nextTrack.src) {
                const targetUrl = new URL(nextTrack.src, document.baseURI).href;
                if (nextAudioPreloader.src !== targetUrl) {
                    nextAudioPreloader.src = nextTrack.src;
                    nextAudioPreloader.load();
                }
            }
        }

        function updateNowPlayingUI(track) {
            if (info && track) {
                info.innerHTML = `<span class="song-name">${track.title}</span><span class="song-artist"> — ${track.artist}</span>`;
            }
        }

        // Carga y reproduce una pista de principio a fin sin cortes ni re-seeks innecesarios
        function loadAndPlayTrack(idx, seekTime = 0, allowSeek = false) {
            const track = radioTracks[idx];
            if (!track || !track.src) return;

            currentTrackIdx = idx;
            updateNowPlayingUI(track);
            preloadNextTrack(idx);

            if (activeMetaHandler) {
                audio.removeEventListener('loadedmetadata', activeMetaHandler);
                activeMetaHandler = null;
            }

            const targetUrl = new URL(track.src, document.baseURI).href;
            if (audio.src !== targetUrl) {
                audio.src = track.src;
                audio.load();

                activeMetaHandler = () => {
                    if ( activeMetaHandler ) {
                        audio.removeEventListener('loadedmetadata', activeMetaHandler);
                        activeMetaHandler = null;
                    }
                    // Solo hacer seek si es el arranque inicial de la página y la canción va avanzada
                    if (allowSeek && seekTime > 3 && audio.duration && seekTime < audio.duration - 6) {
                        try { audio.currentTime = seekTime; } catch (_) { }
                    }
                    audio.play().catch(() => { });
                };
                audio.addEventListener('loadedmetadata', activeMetaHandler);
            } else if (audio.paused) {
                audio.play().catch(() => { });
            }
        }

        function advanceTrack() {
            if (isTransitioning) return;
            isTransitioning = true;
            if (endedTimer) {
                clearTimeout(endedTimer);
                endedTimer = null;
            }
            setTimeout(() => { isTransitioning = false; }, 1500);

            const now = Date.now() + serverTimeOffset;
            let curIdx = currentTrackIdx >= 0 ? currentTrackIdx : 0;
            if (currentTrackIdx < 0 && currentRadioState && currentRadioState.src) {
                curIdx = findTrackIndex(currentRadioState.src);
            }
            const nextIdx = (curIdx + 1) % radioTracks.length;
            const nextTrack = radioTracks[nextIdx];

            const newState = {
                title: nextTrack.title,
                artist: nextTrack.artist,
                src: nextTrack.src,
                startTime: now,
                isPlaying: true,
                source: 'auto'
            };
            currentRadioState = newState;

            // Reproducir la siguiente canción completa desde 0:00 (allowSeek = false)
            loadAndPlayTrack(nextIdx, 0, false);

            // Publicar en Firebase para actualizar clientes y panel DJ
            set(ref(db, 'radio_state/current'), newState).catch(() => { });
        }

        function syncTrack(state) {
            if (!state) return;
            const now = Date.now() + serverTimeOffset;
            const startTime = state.startTime || now;

            // 1. Pausa / Reanudación desde el Admin Panel
            if (state.isPlaying === false) {
                currentRadioState = state;
                audio.pause();
                return;
            }

            // 2. Si el DJ forzó una canción manualmente desde el Admin Panel (source === 'dj')
            if (hasInitialSynced && state.source === 'dj' && state.startTime && state.startTime !== lastDjStartTime) {
                lastDjStartTime = state.startTime;
                currentRadioState = state;
                const djIdx = findTrackIndex(state.src);
                loadAndPlayTrack(djIdx, 0, false);
                return;
            }

            // 3. Si ya estamos reproduciendo activamente una canción, NO permitir que actualizaciones
            //    automáticas de Firebase o desfases de reloj corten la canción antes de que termine de sonar
            if (hasInitialSynced) {
                const wasPausedByAdmin = currentRadioState && currentRadioState.isPlaying === false && state.isPlaying === true;
                currentRadioState = state;
                if (wasPausedByAdmin && audio.paused) {
                    audio.play().catch(() => { });
                }
                return;
            }

            // 4. Arranque inicial (primera carga del stream)
            hasInitialSynced = true;
            if (state.source === 'dj' && state.startTime) {
                lastDjStartTime = state.startTime;
            }

            const resolved = resolveLiveTrack(state.src, startTime, now);
            let bootIdx = resolved.idx;
            let bootSeek = resolved.seekTime;
            let bootVirtualStart = resolved.virtualStartTime;

            // Si a la canción actual le quedan menos de 8 segundos al arrancar, empezar limpiamente desde 0:00 en la siguiente
            if (bootSeek >= radioTracks[bootIdx].duration - 8) {
                bootIdx = (bootIdx + 1) % radioTracks.length;
                bootSeek = 0;
                bootVirtualStart = now;
            }

            const liveTrack = radioTracks[bootIdx];

            if (liveTrack.src !== state.src || Math.abs(bootVirtualStart - startTime) > 5000) {
                const correctedState = {
                    title: liveTrack.title,
                    artist: liveTrack.artist,
                    src: liveTrack.src,
                    startTime: bootVirtualStart,
                    isPlaying: true,
                    source: 'auto'
                };
                currentRadioState = correctedState;
                set(ref(db, 'radio_state/current'), correctedState).catch(() => { });
            } else {
                currentRadioState = state;
            }

            loadAndPlayTrack(bootIdx, bootSeek, bootSeek > 3);
        }

        // Suscripción reactiva en tiempo real al estado de la radio
        onValue(ref(db, 'radio_state/current'), snap => {
            const state = snap.val();
            syncTrack(state);
        });

        // Carga inmediata vía REST para que no tarde ni medio segundo
        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/current.json')
            .then(res => res.json())
            .then(state => {
                if (!hasInitialSynced && state) syncTrack(state);
            })
            .catch(() => { });

        // Al terminar naturalmente la pista (100% reproducida), dar 200ms de respiro al buffer de audio y avanzar
        audio.addEventListener('ended', () => {
            if (endedTimer) clearTimeout(endedTimer);
            endedTimer = setTimeout(() => {
                advanceTrack();
            }, 200);
        });

        // Si un archivo de audio llegara a fallar en carga de red, saltar limpiamente a la siguiente pista
        audio.addEventListener('error', () => {
            if (hasInitialSynced && !isTransitioning) {
                setTimeout(advanceTrack, 1000);
            }
        });

        // Guardián pasivo de seguridad: SOLO actúa si el evento 'ended' ya ocurrió y el reproductor quedó detenido
        setInterval(() => {
            if (hasInitialSynced && !isTransitioning && currentRadioState && currentRadioState.isPlaying !== false) {
                if (audio.ended) {
                    advanceTrack();
                }
            }
        }, 2500);

        // ── 3. Cintillo de Noticias en Vivo (Mix Variado: Cultura, Música, Tecnología, Actualidad) ──
        const elNewsCat = document.getElementById('news-cat');
        const elNewsTitle = document.getElementById('news-title');

        let newsList = [
            { category: "GAMING", title: "Novedades, récords y grandes lanzamientos marcan la industria global del videojuego" },
            { category: "TECNOLOGÍA", title: "Avances en inteligencia artificial, semiconductores y ciberseguridad definen la agenda tecnológica" }
        ];
        let newsIdx = 0;
        let newsTimer = null;

        function scheduleNextNews(durationMs = 14000) {
            if (newsTimer) clearTimeout(newsTimer);
            newsTimer = setTimeout(cycleNews, durationMs);
        }

        function renderNewsItem(item) {
            if (!item || !elNewsTitle) return;
            elNewsTitle.style.opacity = '0';

            setTimeout(() => {
                if (elNewsCat) elNewsCat.textContent = item.category || 'NOTICIAS';
                const cleanText = (item.title || '').trim().replace(/\.+$/, '');
                elNewsTitle.textContent = cleanText;
                elNewsTitle.style.opacity = '1';

                // Duración generosa: 16 segundos para "UN DÍA COMO HOY" o textos largos, 13 segundos normal
                const isLong = (item.title && item.title.length > 70) || (item.category && item.category.includes('DÍA'));
                const displayMs = isLong ? 16000 : 13000;
                scheduleNextNews(displayMs);
            }, 350);
        }

        function cycleNews() {
            if (!newsList || newsList.length === 0) return;
            newsIdx = (newsIdx + 1) % newsList.length;
            renderNewsItem(newsList[newsIdx]);
        }

        // Suscripción reactiva en tiempo real al feed de noticias de Firebase
        onValue(ref(db, 'radio_state/news/items'), snap => {
            const data = snap.val();
            if (Array.isArray(data) && data.length > 0) {
                const wasEmpty = !newsList || newsList.length === 0;
                newsList = data;
                if (wasEmpty) {
                    renderNewsItem(newsList[0]);
                }
            }
        });

        // Carga inmediata vía REST de noticias
        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/news/items.json')
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    const wasEmpty = !newsList || newsList.length === 0;
                    newsList = data;
                    if (wasEmpty) {
                        renderNewsItem(newsList[0]);
                    }
                }
            })
            .catch(() => { });

        // Iniciar la primera noticia
        renderNewsItem(newsList[0]);

        window.addEventListener('click', function () {
            if (audio.paused) {
                audio.play().catch(() => { });
            }
        });
    </script>
