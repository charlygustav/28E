  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
      --apple-glass: rgba(18, 18, 22, 0.52);
      --apple-glass-hover: rgba(28, 28, 34, 0.68);
      --apple-glass-border: rgba(255, 255, 255, 0.12);
      --apple-glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      --apple-glass-blur: blur(28px) saturate(190%);
      --accent-live: #ff3b30;
      --accent-active: #34c759;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
    }

    /* CONTENEDOR TEATRAL CON FONDO AMBIENTAL */
    .tv-cinema-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000 url('assets/mockups/tv_ambient_backdrop.jpg') center center / cover no-repeat;
      overflow: hidden;
      cursor: default;
    }

    .tv-cinema-stage.is-idle {
      cursor: none !important;
    }

    /* PANTALLA PRINCIPAL DE VIDEO */
    .tv-screen-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
    }

    /* UNIDAD TELEVISOR SONY CON MOCKUP DEFINITIVO */
    .tv-mockup-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (1376 / 768));
      max-height: calc(100vw * (768 / 1376));
      max-width: calc(100dvh * (1376 / 768));
      aspect-ratio: 1376 / 768;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 80px rgba(0, 0, 0, 0.8));
    }

    /* PANTALLA INTERIOR (APERTURA EXACTA RECORTE TRANSPARENTE) */
    .tv-screen-aperture {
      position: absolute;
      left: 10.647%;
      top: 5.273%;
      width: 79.978%;
      height: 80.404%;
      background: #000;
      z-index: 2;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTENEDOR Y REPRODUCTOR YOUTUBE */
    #tv-youtube-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #tv-youtube-container iframe,
    #tv-youtube-player {
      width: 100% !important;
      height: 100% !important;
      transform: scale(1.01);
      border: 0 !important;
      display: block;
      pointer-events: none;
    }

    /* ESCUDO DE CLIC */
    .yt-click-shield {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      pointer-events: auto;
    }

    /* CHASIS DEL MOCKUP SONY CRT (OVERLAY SUPERIOR) */
    .tv-mockup-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 10;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* SCANLINES CRT SUTILES */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
        radial-gradient(circle at 50% 50%, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      background-size: 100% 3px, 100% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .crt-overlay.active {
      opacity: 1;
    }

    /* ── BOTONES FÍSICOS INTERACTIVOS EN EL CHASIS DEL TELEVISOR ── */
    .tv-hardware-btn {
      position: absolute;
      z-index: 12;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      pointer-events: auto;
      padding: 0;
      margin: 0;
      transition: transform 0.08s cubic-bezier(0.2, 0, 0, 1), background-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tv-hardware-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.2);
    }

    .tv-hardware-btn:active {
      transform: scale(0.93) translateY(1px);
      background-color: rgba(0, 0, 0, 0.25);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75);
    }

    /* Volumen - */
    .tv-hw-vol-down {
      left: 81.76%;
      top: 94.01%;
      width: 3.63%;
      height: 4.56%;
      border-radius: 4px 0 0 4px;
    }

    /* Volumen + */
    .tv-hw-vol-up {
      left: 85.47%;
      top: 94.01%;
      width: 3.71%;
      height: 4.56%;
      border-radius: 0 4px 4px 0;
    }

    /* Botón Power (Circular) */
    .tv-hw-power {
      left: 91.28%;
      top: 92.71%;
      width: 3.20%;
      height: 5.73%;
      border-radius: 50% !important;
    }

    .tv-hw-power:hover {
      background-color: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.28), 0 0 6px rgba(255, 255, 255, 0.15);
    }

    .tv-hw-power:active {
      transform: scale(0.91) translateY(1.2px);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.85);
    }

    .tv-hw-power.is-off {
      box-shadow: inset 0 0 5px rgba(255, 59, 48, 0.85), 0 0 8px rgba(255, 59, 48, 0.5);
    }

    /* ── COMPONENTES ESTILO APPLE (FROSTED GLASS & SPRINGS) ── */
    .apple-glass {
      background: var(--apple-glass);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      border: 1px solid var(--apple-glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42), var(--apple-glass-highlight);
    }

    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      outline: none;
      border-radius: 9999px;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.18s ease, color 0.18s ease, opacity 0.18s ease;
    }

    .apple-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .apple-btn:active {
      transform: scale(0.92);
    }

    /* BARRA SUPERIOR (HEADER MINIMALISTA) */
    .apple-top-bar {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-back-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px 7px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.2s ease, border-color 0.2s ease;
    }

    .apple-back-pill:hover {
      background: var(--apple-glass-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .apple-back-pill:active {
      transform: scale(0.94);
    }

    .apple-back-pill svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* FLASH DE CONFIRMACIÓN AL CENTRO (APPLE STYLE FEEDBACK) */
    .apple-action-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      pointer-events: none;
    }

    .apple-action-flash svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    /* TOAST ELEGANTE PARA ACTIVAR AUDIO (SOLO SI EL NAVEGADOR BLOQUEA AUDIO) */
    .apple-unmute-pill {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), background 0.18s ease;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    .apple-unmute-pill:hover {
      background: var(--apple-glass-hover);
    }

    .apple-unmute-pill:active {
      transform: translateX(-50%) scale(0.95);
    }

    .apple-unmute-pill.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    .apple-unmute-pill svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ESTADO IDLE (HUD OCULTO) */
    .is-idle .apple-top-bar {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .is-idle .apple-unmute-pill:not(.hidden) {
      opacity: 0.4;
    }

    /* ── 28E TV CINEMATIC INTRO IDENT ── */
    .tv-intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tv-intro-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .apple-stream-info {
        display: none;
      }
      .apple-dock-divider {
        display: none;
      }
      .apple-slider-wrap {
        width: 56px;
      }
    }
  </style>
</head>
<body>

  <!-- 28E TV · IDENT DE ENTRADA CINEMATOGRÁFICO -->
  <div id="tvIntro" class="tv-intro-overlay" role="dialog" aria-modal="true" aria-label="28E TV Ident">

  <!-- ESCENARIO TEATRAL PRINCIPAL -->
  <main class="tv-cinema-stage" id="cinema-stage">
    
    <!-- PANTALLA DE EMISIÓN -->
    <div class="tv-screen-viewport" id="tv-screen">
      
      <!-- UNIDAD TELEVISOR SONY CON MOCKUP DEFINITIVO -->

        <!-- Chasis del televisor overlay definitivo original -->

        <!-- BOTONES FÍSICOS INTERACTIVOS EN EL CHASIS -->
        <button class="tv-hardware-btn tv-hw-vol-down" id="hw-vol-down" aria-label="Bajar Volumen (-)" title="Bajar Volumen (-)" type="button"></button>
        <button class="tv-hardware-btn tv-hw-vol-up" id="hw-vol-up" aria-label="Subir Volumen (+)" title="Subir Volumen (+)" type="button"></button>
        <button class="tv-hardware-btn tv-hw-power" id="hw-power" aria-label="Apagar / Encender TV" title="Power" type="button"></button>
      </div>

      <!-- FLASH DE CONFIRMACIÓN AL CENTRO -->
      <div class="apple-glass apple-action-flash" id="apple-action-flash">

      <!-- BARRA SUPERIOR APPLE -->
      <header class="apple-top-bar" id="apple-top-bar">

          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>

        </a>

      <!-- HINT PARA ACTIVAR AUDIO SI EL NAVEGADOR LO INICIA SILENCIADO -->
      <div class="apple-glass apple-unmute-pill hidden" id="apple-unmute-pill">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <span>Activar audio</span>
      </div>

    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const YOUTUBE_STREAM_ID = 'Gfnj_4BU9cs';

      let ytPlayer = null;
      let ytReady = false;
      let isMuted = true;
      let currentVolume = 0.65;
      let isPlaying = true;
      let idleTimer = null;

      // Elementos DOM
      const cinemaStage = document.getElementById('cinema-stage');
      const crtOverlay = document.getElementById('crt-overlay');
      const flashEl = document.getElementById('apple-action-flash');
      const flashIcon = document.getElementById('flash-icon');
      const unmutePill = document.getElementById('apple-unmute-pill');
      const ytClickShield = document.getElementById('yt-click-shield');
      const btnHwVolDown = document.getElementById('hw-vol-down');
      const btnHwVolUp = document.getElementById('hw-vol-up');
      const btnHwPower = document.getElementById('hw-power');
      const tvContainer = document.getElementById('tv-youtube-container');

      let isTvPowered = true;
      function updatePlayPauseIcon(playing) {}

      // ── SONIDO TÁCTIL DE BOTONES FÍSICOS (WEB AUDIO API) ──
      let audioCtx = null;
      function playMechanicalClick(isPower = false) {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          if (isPower) {
            // Relé mecánico / switch pesado para Power
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, t);
            osc.frequency.exponentialRampToValueAtTime(45, t + 0.05);

            gain.gain.setValueAtTime(0.32, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.05);
          } else {
            // Micro-switch táctil para volumen +/-
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, t);
            osc.frequency.exponentialRampToValueAtTime(160, t + 0.025);

            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.025);
          }
        } catch (e) {}
      }

      // ── WAKE & IDLE (APPLE BEHAVIOR) ──
      function wakeControls() {
        if (!cinemaStage) return;
        cinemaStage.classList.remove('is-idle');

        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          cinemaStage.classList.add('is-idle');
        }, 2500);
      }

      window.addEventListener('mousemove', wakeControls, { passive: true });
      window.addEventListener('touchstart', wakeControls, { passive: true });
      window.addEventListener('click', wakeControls, { passive: true });

      // ── FLASH DE ACCIÓN EN EL CENTRO ──
      function showCenterFlash(type) {
        if (!flashEl || !flashIcon) return;
        if (type === 'play') {
          flashIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        } else if (type === 'pause') {
          flashIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
        } else if (type === 'unmute') {
          flashIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else if (type === 'mute') {
          flashIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        } else if (type === 'power-off' || type === 'power-on') {
          flashIcon.innerHTML = '<path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
        }

        if (window.gsap) {
          gsap.killTweensOf(flashEl);
          gsap.fromTo(flashEl,
            { opacity: 0, scale: 0.72, display: 'flex' },
            {
              opacity: 1,
              scale: 1,
              duration: 0.16,
              ease: 'power3.out',
              onComplete: () => {
                gsap.to(flashEl, {
                  opacity: 0,
                  scale: 1.15,
                  duration: 0.28,
                  ease: 'power2.in',
                  delay: 0.14,
                  onComplete: () => { flashEl.style.display = 'none'; }
                });
              }
            }
          );
        } else {
          flashEl.style.display = 'flex';
          setTimeout(() => { flashEl.style.display = 'none'; }, 400);
        }
      }

      // ── GESTIÓN DE AUDIO ──
      function setMuteState(muted, customVol = null, userTriggered = false) {
        isMuted = muted;
        if (customVol !== null) currentVolume = customVol;

        if (isMuted) {
          if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
          if (unmutePill) unmutePill.classList.remove('hidden');
          if (userTriggered) showCenterFlash('mute');
        } else {
          if (unmutePill) unmutePill.classList.add('hidden');
          const targetVol = currentVolume > 0 ? currentVolume : 0.65;
          currentVolume = targetVol;
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            ytPlayer.unMute();
            ytPlayer.setVolume(targetVol * 100);
          }
          if (userTriggered) showCenterFlash('unmute');
        }
      }

      if (unmutePill) {
        unmutePill.addEventListener('click', (e) => {
          e.stopPropagation();
          setMuteState(false, 0.65, true);
          wakeControls();
        });
      }

      // ── CONTROL DE ENERGÍA (POWER ON / OFF ESTILO CRT SONY) ──
      function turnOffTV() {
        if (!isTvPowered) return;
        isTvPowered = false;
        if (btnHwPower) {
          btnHwPower.classList.add('is-off');
          btnHwPower.setAttribute('aria-label', 'Encender TV');
          btnHwPower.setAttribute('title', 'Power (Encender)');
        }
        showCenterFlash('power-off');

        if (window.gsap && tvContainer) {
          gsap.killTweensOf(tvContainer);
          gsap.timeline()
            .to(tvContainer, {
              scaleY: 0.005,
              scaleX: 1.02,
              filter: 'brightness(2.2) contrast(1.4)',
              duration: 0.14,
              ease: 'power2.in'
            })
            .to(tvContainer, {
              scaleX: 0.005,
              filter: 'brightness(4)',
              duration: 0.12,
              ease: 'power3.in'
            })
            .to(tvContainer, {
              opacity: 0,
              duration: 0.08,
              onComplete: () => {
                if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                  ytPlayer.pauseVideo();
                }
                isPlaying = false;
                updatePlayPauseIcon(false);
              }
            });
        } else if (tvContainer) {
          tvContainer.style.opacity = '0';
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
          isPlaying = false;
          updatePlayPauseIcon(false);
        }
      }

      function turnOnTV() {
        if (isTvPowered) return;
        isTvPowered = true;
        if (btnHwPower) {
          btnHwPower.classList.remove('is-off');
          btnHwPower.setAttribute('aria-label', 'Apagar TV');
          btnHwPower.setAttribute('title', 'Power (Apagar)');
        }
        showCenterFlash('power-on');

        if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
          ytPlayer.playVideo();
        }
        isPlaying = true;
        updatePlayPauseIcon(true);

        if (window.gsap && tvContainer) {
          gsap.killTweensOf(tvContainer);
          gsap.set(tvContainer, { opacity: 1, scaleX: 0.005, scaleY: 0.005, filter: 'brightness(3.5)' });
          gsap.timeline()
            .to(tvContainer, {
              scaleX: 1.02,
              scaleY: 0.005,
              filter: 'brightness(2)',
              duration: 0.14,
              ease: 'power3.out'
            })
            .to(tvContainer, {
              scaleX: 1,
              scaleY: 1,
              filter: 'brightness(1) contrast(1)',
              duration: 0.22,
              ease: 'back.out(1.2)'
            });
        } else if (tvContainer) {
          tvContainer.style.opacity = '1';
          tvContainer.style.transform = 'none';
          tvContainer.style.filter = 'none';
        }
      }

      function toggleTvPower() {
        if (isTvPowered) {
          turnOffTV();
        } else {
          turnOnTV();
        }
      }

      // ── BOTONES FÍSICOS DEL CHASIS DEL MOCKUP ──
      if (btnHwVolDown) {
        btnHwVolDown.addEventListener('click', (e) => {
          e.stopPropagation();
          playMechanicalClick(false);
          if (!isTvPowered) {
            turnOnTV();
            return;
          }
          const currentVal = isMuted ? 0 : currentVolume;
          const nextVol = Math.max(0, Math.round((currentVal - 0.10) * 10) / 10);
          if (nextVol <= 0.05) {
            setMuteState(true, 0, true);
          } else {
            setMuteState(false, nextVol, true);
          }
          wakeControls();
        });
      }

      if (btnHwVolUp) {
        btnHwVolUp.addEventListener('click', (e) => {
          e.stopPropagation();
          playMechanicalClick(false);
          if (!isTvPowered) {
            turnOnTV();
            return;
          }
          const currentVal = isMuted ? 0 : currentVolume;
          const nextVol = Math.min(1.0, Math.round((currentVal + 0.10) * 10) / 10);
          setMuteState(false, Math.max(0.10, nextVol), true);
          wakeControls();
        });
      }

      if (btnHwPower) {
        btnHwPower.addEventListener('click', (e) => {
          e.stopPropagation();
          playMechanicalClick(true);
          toggleTvPower();
          wakeControls();
        });
      }

      // ── PLAY / PAUSE ──
      function togglePlayPause(userTriggered = false) {
        if (!isTvPowered) {
          playMechanicalClick(true);
          turnOnTV();
          return;
        }
        if (!ytPlayer) return;
        if (isPlaying) {
          if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
          isPlaying = false;
          if (userTriggered) showCenterFlash('pause');
        } else {
          if (typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
          isPlaying = true;
          if (isMuted) setMuteState(false, 0.65, false);
          if (userTriggered) showCenterFlash('play');
        }
      }

      // ── CLIC EN PANTALLA ──
      ytClickShield.addEventListener('click', () => {
        if (!isTvPowered) {
          playMechanicalClick(true);
          turnOnTV();
          wakeControls();
          return;
        }
        if (isMuted) {
          setMuteState(false, 0.65, true);
        } else {
          togglePlayPause(true);
        }
        wakeControls();
      });

      // Doble clic en pantalla para pantalla completa
      ytClickShield.addEventListener('dblclick', (e) => {
        e.preventDefault();
        toggleFullscreen();
      });

      // ── FULLSCREEN ──
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        }
        wakeControls();
      }

      // ── ATAJOS DE TECLADO ──
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const key = e.key.toLowerCase();
        if (key === 'm') {
          e.preventDefault();
          setMuteState(!isMuted, null, true);
          wakeControls();
        } else if (key === 'f') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 'c') {
          e.preventDefault();
          if (crtOverlay) crtOverlay.classList.toggle('active');
          wakeControls();
        } else if (e.code === 'Space' || key === 'k') {
          e.preventDefault();
          togglePlayPause(true);
          wakeControls();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (btnHwVolUp) btnHwVolUp.click();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (btnHwVolDown) btnHwVolDown.click();
        } else if (key === 'p') {
          e.preventDefault();
          if (btnHwPower) btnHwPower.click();
        }
      });

      // ── YOUTUBE IFRAME API ──
      function loadYouTubeAPI(callback) {
        if (window.YT && window.YT.Player) {
          ytReady = true;
          callback();
          return;
        }
        window.onYouTubeIframeAPIReady = function () {
          ytReady = true;
          callback();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(tag, first);
      }

      function initYouTubeLiveStream(unmuteInitial = false) {
        loadYouTubeAPI(() => {
          ytPlayer = new YT.Player('tv-youtube-player', {
            height: '100%',
            width: '100%',
            videoId: YOUTUBE_STREAM_ID,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              modestbranding: 1,
              rel: 0,
              iv_load_policy: 3,
              cc_load_policy: 0,
              playsinline: 1,
              enablejsapi: 1,
              origin: window.location.origin
            },
            events: {
              onReady: function (event) {
                if (unmuteInitial) {
                  setMuteState(false, 0.65, false);
                } else {
                  setMuteState(true, null, false);
                }
                event.target.playVideo();
                isPlaying = true;
                updatePlayPauseIcon(true);
              },
              onStateChange: function (event) {
                if (event.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  updatePlayPauseIcon(true);
                } else if (event.data === YT.PlayerState.PAUSED) {
                  isPlaying = false;
                  updatePlayPauseIcon(false);
                } else if (event.data === YT.PlayerState.ENDED) {
                  setTimeout(() => {
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                      ytPlayer.playVideo();
                    }
                  }, 3500);
                }
              },
              onError: function () {
                setTimeout(() => {
                  if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                  }
                }, 4000);
              }
            }
          });
        });
      }

      // ── INTRO CINEMÁTICA ──
      function playTVIntroSequence(onFinished) {
        const introEl = document.getElementById('tvIntro');
        const video = document.getElementById('tvIntroVideo');

        if (!introEl || !video) {
          if (onFinished) onFinished(false);
          return;
        }

        let completed = false;
        let userUnmuted = false;

        function finish() {
          if (completed) return;
          completed = true;

          window.removeEventListener('keydown', onKeyDown);
          introEl.removeEventListener('pointerdown', onScreenInteraction);
          video.onended = null;
          video.onerror = null;

          introEl.style.opacity = '0';
          introEl.style.pointerEvents = 'none';

          setTimeout(() => {
            try {
              video.pause();
              video.currentTime = 0;
            } catch (e) {}
            introEl.style.display = 'none';
            if (typeof onFinished === 'function') onFinished(userUnmuted);
          }, 450);
        }

        function onKeyDown(e) {
          if (e.key === 'Escape' || e.code === 'Space') {
            e.preventDefault();
            finish();
          }
        }

        function onScreenInteraction() {
          if (video.muted) {
            video.muted = false;
            video.volume = 1.0;
            userUnmuted = true;
          }
        }

        window.addEventListener('keydown', onKeyDown);
        introEl.addEventListener('pointerdown', onScreenInteraction);

        video.onended = () => finish();
        video.onerror = () => finish();

        setTimeout(() => {
          if (!completed) finish();
        }, 13000);

        try {
          video.currentTime = 0;
          video.volume = 1.0;
          video.muted = false;

          const playPromise = video.play();
          if (playPromise && playPromise.then) {
            playPromise.then(() => {
              userUnmuted = true;
            }).catch(() => {
              video.muted = true;
              video.play().catch(() => finish());
            });
          }
        } catch (err) {
          finish();
        }
      }

      function initTV() {
        playTVIntroSequence((unmuted) => {
          initYouTubeLiveStream(unmuted);
          wakeControls();
        });
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initTV);
      } else {
        initTV();
      }

    })();
  </script>
</body>
</html>
