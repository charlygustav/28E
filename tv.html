<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>28E TV · Twenty Eight Experience Radio (En Vivo 24/7)</title>
  <meta name="description" content="28E TV: Transmisión en vivo oficial 24/7 de Twenty Eight Experience Radio.">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Tipografía: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- GSAP -->
  <script src="gsap.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
      --apple-glass: rgba(18, 18, 22, 0.52);
      --apple-glass-hover: rgba(28, 28, 34, 0.68);
      --apple-glass-border: rgba(255, 255, 255, 0.12);
      --apple-glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      --apple-glass-blur: blur(28px) saturate(190%);
      --accent-live: #ff3b30;
      --accent-active: #34c759;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
    }

    /* CONTENEDOR TEATRAL CON FONDO AMBIENTAL */
    .tv-cinema-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000 url('assets/mockups/tv_ambient_backdrop.jpg') center center / cover no-repeat;
      overflow: hidden;
      cursor: default;
    }

    .tv-cinema-stage.is-idle {
      cursor: none !important;
    }

    /* PANTALLA PRINCIPAL DE VIDEO */
    .tv-screen-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
    }

    /* UNIDAD TELEVISOR SONY CON MOCKUP DEFINITIVO */
    .tv-mockup-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (1376 / 768));
      max-height: calc(100vw * (768 / 1376));
      max-width: calc(100dvh * (1376 / 768));
      aspect-ratio: 1376 / 768;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 80px rgba(0, 0, 0, 0.8));
    }

    /* PANTALLA INTERIOR (APERTURA EXACTA RECORTE TRANSPARENTE) */
    .tv-screen-aperture {
      position: absolute;
      left: 10.647%;
      top: 5.273%;
      width: 79.978%;
      height: 80.404%;
      background: #000;
      z-index: 2;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTENEDOR Y REPRODUCTOR YOUTUBE */
    #tv-youtube-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #tv-youtube-container iframe,
    #tv-youtube-player {
      width: 100% !important;
      height: 100% !important;
      transform: scale(1.01);
      border: 0 !important;
      display: block;
      pointer-events: none;
    }

    /* ESCUDO DE CLIC */
    .yt-click-shield {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      pointer-events: auto;
    }

    /* CHASIS DEL MOCKUP SONY CRT (OVERLAY SUPERIOR) */
    .tv-mockup-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 10;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* SCANLINES CRT SUTILES */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
        radial-gradient(circle at 50% 50%, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      background-size: 100% 3px, 100% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .crt-overlay.active {
      opacity: 1;
    }

    /* ── COMPONENTES ESTILO APPLE (FROSTED GLASS & SPRINGS) ── */
    .apple-glass {
      background: var(--apple-glass);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      border: 1px solid var(--apple-glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42), var(--apple-glass-highlight);
    }

    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      outline: none;
      border-radius: 9999px;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.18s ease, color 0.18s ease, opacity 0.18s ease;
    }

    .apple-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .apple-btn:active {
      transform: scale(0.92);
    }

    /* BARRA SUPERIOR (HEADER MINIMALISTA) */
    .apple-top-bar {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-back-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px 7px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.2s ease, border-color 0.2s ease;
    }

    .apple-back-pill:hover {
      background: var(--apple-glass-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .apple-back-pill:active {
      transform: scale(0.94);
    }

    .apple-back-pill svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .apple-live-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.95);
    }

    .apple-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-live);
      box-shadow: 0 0 10px var(--accent-live);
      position: relative;
    }

    .apple-live-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-live);
      opacity: 0.8;
      animation: livePulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes livePulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* FLASH DE CONFIRMACIÓN AL CENTRO (APPLE STYLE FEEDBACK) */
    .apple-action-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      pointer-events: none;
    }

    .apple-action-flash svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    /* BARRA FLOTANTE INFERIOR (APPLE DOCK CAPSULE) */
    .apple-bottom-dock {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 12px;
      border-radius: 9999px;
      pointer-events: auto;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-play-btn {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      flex-shrink: 0;
    }

    .apple-play-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .apple-play-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .apple-stream-info {
      display: flex;
      flex-direction: column;
      padding: 0 4px;
      max-width: 180px;
    }

    .apple-stream-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .apple-stream-meta {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .apple-dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    /* CONTROL DE VOLUMEN APPLE */
    .apple-volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .apple-icon-btn {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .apple-icon-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .apple-slider-wrap {
      display: flex;
      align-items: center;
      width: 72px;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.22);
      outline: none;
      cursor: pointer;
    }

    .apple-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* TOAST ELEGANTE PARA DESMUTEAR (SOLO SI AUTOPLAY LO SILENCIA) */
    .apple-unmute-pill {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .apple-unmute-pill.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(8px);
      pointer-events: none;
    }

    .apple-unmute-pill svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ESTADO IDLE (HUD OCULTO) */
    .is-idle .apple-top-bar {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .is-idle .apple-bottom-dock {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
      pointer-events: none;
    }

    /* ── 28E TV CINEMATIC INTRO IDENT ── */
    .tv-intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tv-intro-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .apple-stream-info {
        display: none;
      }
      .apple-dock-divider {
        display: none;
      }
      .apple-slider-wrap {
        width: 56px;
      }
    }
  </style>
</head>
<body>

  <!-- 28E TV · IDENT DE ENTRADA CINEMATOGRÁFICO -->
  <div id="tvIntro" class="tv-intro-overlay" role="dialog" aria-modal="true" aria-label="28E TV Ident">

    <div class="tv-screen-viewport" id="tv-screen">

      <div class="tv-mockup-wrapper">

            <div id="tv-youtube-player"></div>
          </div>

  <script>
    (function () {
      'use strict';

      const YOUTUBE_STREAM_ID = 'Gfnj_4BU9cs';

      let ytPlayer = null;
      let ytReady = false;
      let isMuted = true;
      let currentVolume = 0.65;
      let isPlaying = true;
      let idleTimer = null;

      // Elementos DOM
      const cinemaStage = document.getElementById('cinema-stage');
      const volumeSlider = document.getElementById('volume-slider');
      const btnMute = document.getElementById('btn-mute');
      const btnPlayPause = document.getElementById('btn-play-pause');
      const btnCrt = document.getElementById('btn-crt');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const crtOverlay = document.getElementById('crt-overlay');
      const iconVol = document.getElementById('icon-vol');
      const iconPlayPause = document.getElementById('icon-play-pause');
      const iconFullscreen = document.getElementById('icon-fullscreen');
      const flashEl = document.getElementById('apple-action-flash');
      const flashIcon = document.getElementById('flash-icon');
      const unmutePill = document.getElementById('apple-unmute-pill');
      const ytClickShield = document.getElementById('yt-click-shield');

      // ── WAKE & IDLE (APPLE BEHAVIOR) ──
      function wakeControls() {
        if (!cinemaStage) return;
        cinemaStage.classList.remove('is-idle');

        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          cinemaStage.classList.add('is-idle');
        }, 2500);
      }

      window.addEventListener('mousemove', wakeControls, { passive: true });
      window.addEventListener('touchstart', wakeControls, { passive: true });
      window.addEventListener('click', wakeControls, { passive: true });

      // ── FLASH DE ACCIÓN EN EL CENTRO ──
      function showCenterFlash(type) {
        if (!flashEl || !flashIcon) return;
        if (type === 'play') {
          flashIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        } else if (type === 'pause') {
          flashIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
        } else if (type === 'unmute') {
          flashIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else if (type === 'mute') {
          flashIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        }

        if (window.gsap) {
          gsap.killTweensOf(flashEl);
          gsap.fromTo(flashEl,
            { opacity: 0, scale: 0.72, display: 'flex' },
            {
              opacity: 1,
              scale: 1,
              duration: 0.16,
              ease: 'power3.out',
              onComplete: () => {
                gsap.to(flashEl, {
                  opacity: 0,
                  scale: 1.15,
                  duration: 0.28,
                  ease: 'power2.in',
                  delay: 0.14,
                  onComplete: () => { flashEl.style.display = 'none'; }
                });
              }
            }
          );
        } else {
          flashEl.style.display = 'flex';
          setTimeout(() => { flashEl.style.display = 'none'; }, 400);
        }
      }

      // ── ACTUALIZAR ICONOS ──
      function updateVolumeIcon(vol) {
        if (!iconVol) return;
        if (vol <= 0 || isMuted) {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        } else if (vol < 0.5) {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        }
      }

      function updatePlayPauseIcon(playing) {
        if (!iconPlayPause) return;
        if (playing) {
          iconPlayPause.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
        } else {
          iconPlayPause.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        }
      }

      // ── GESTIÓN DE AUDIO ──
      function setMuteState(muted, customVol = null, userTriggered = false) {
        isMuted = muted;
        if (customVol !== null) currentVolume = customVol;

        if (isMuted) {
          if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
          volumeSlider.value = 0;
          updateVolumeIcon(0);
          if (unmutePill) unmutePill.classList.remove('hidden');
          if (userTriggered) showCenterFlash('mute');
        } else {
          if (unmutePill) unmutePill.classList.add('hidden');
          const targetVol = currentVolume > 0 ? currentVolume : 0.65;
          currentVolume = targetVol;
          volumeSlider.value = targetVol;
          updateVolumeIcon(targetVol);
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            ytPlayer.unMute();
            ytPlayer.setVolume(targetVol * 100);
          }
          if (userTriggered) showCenterFlash('unmute');
        }
      }

      btnMute.addEventListener('click', () => {
        setMuteState(!isMuted, null, true);
        wakeControls();
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (val === 0) {
          setMuteState(true, null, false);
        } else {
          setMuteState(false, val, false);
        }
        wakeControls();
      });

      if (unmutePill) {
        unmutePill.addEventListener('click', (e) => {
          e.stopPropagation();
          setMuteState(false, 0.65, true);
          wakeControls();
        });
      }

      // ── PLAY / PAUSE ──
      function togglePlayPause(userTriggered = false) {
        if (!ytPlayer) return;
        if (isPlaying) {
          if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
          isPlaying = false;
          if (userTriggered) showCenterFlash('pause');
        } else {
          if (typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
          isPlaying = true;
          if (isMuted) setMuteState(false, 0.65, false);
          if (userTriggered) showCenterFlash('play');
        }
        updatePlayPauseIcon(isPlaying);
      }

      btnPlayPause.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause(true);
        wakeControls();
      });

      // ── CLIC EN PANTALLA ──
      ytClickShield.addEventListener('click', () => {
        if (isMuted) {
          setMuteState(false, 0.65, true);
        } else {
          togglePlayPause(true);
        }
        wakeControls();
      });

      // ── CRT ──
      btnCrt.addEventListener('click', (e) => {
        e.stopPropagation();
        crtOverlay.classList.toggle('active');
        btnCrt.style.color = crtOverlay.classList.contains('active') ? 'var(--accent-active)' : 'rgba(255, 255, 255, 0.88)';
        wakeControls();
      });

      // ── FULLSCREEN ──
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        }
        wakeControls();
      }

      btnFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });

      document.addEventListener('fullscreenchange', () => {
        if (!iconFullscreen) return;
        if (document.fullscreenElement) {
          iconFullscreen.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
        } else {
          iconFullscreen.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
        }
      });

      // ── ATAJOS DE TECLADO ──
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const key = e.key.toLowerCase();
        if (key === 'm') {
          e.preventDefault();
          setMuteState(!isMuted, null, true);
          wakeControls();
        } else if (key === 'f') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 'c') {
          e.preventDefault();
          btnCrt.click();
        } else if (e.code === 'Space' || key === 'k') {
          e.preventDefault();
          togglePlayPause(true);
          wakeControls();
        }
      });

      // ── YOUTUBE IFRAME API ──
      function loadYouTubeAPI(callback) {
        if (window.YT && window.YT.Player) {
          ytReady = true;
          callback();
          return;
        }
        window.onYouTubeIframeAPIReady = function () {
          ytReady = true;
          callback();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(tag, first);
      }

      function initYouTubeLiveStream(unmuteInitial = false) {
        loadYouTubeAPI(() => {
          ytPlayer = new YT.Player('tv-youtube-player', {
            height: '100%',
            width: '100%',
            videoId: YOUTUBE_STREAM_ID,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              modestbranding: 1,
              rel: 0,
              iv_load_policy: 3,
              cc_load_policy: 0,
              playsinline: 1,
              enablejsapi: 1,
              origin: window.location.origin
            },
            events: {
              onReady: function (event) {
                if (unmuteInitial) {
                  setMuteState(false, 0.65, false);
                } else {
                  setMuteState(true, null, false);
                }
                event.target.playVideo();
                isPlaying = true;
                updatePlayPauseIcon(true);
              },
              onStateChange: function (event) {
                if (event.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  updatePlayPauseIcon(true);
                } else if (event.data === YT.PlayerState.PAUSED) {
                  isPlaying = false;
                  updatePlayPauseIcon(false);
                } else if (event.data === YT.PlayerState.ENDED) {
                  setTimeout(() => {
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                      ytPlayer.playVideo();
                    }
                  }, 3500);
                }
              },
              onError: function () {
                setTimeout(() => {
                  if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                  }
                }, 4000);
              }
            }
          });
        });
      }

      // ── INTRO CINEMÁTICA ──
      function playTVIntroSequence(onFinished) {
        const introEl = document.getElementById('tvIntro');
        const video = document.getElementById('tvIntroVideo');

        if (!introEl || !video) {
          if (onFinished) onFinished(false);
          return;
        }

        let completed = false;
        let userUnmuted = false;

        function finish() {
          if (completed) return;
          completed = true;

          window.removeEventListener('keydown', onKeyDown);
          introEl.removeEventListener('pointerdown', onScreenInteraction);
          video.onended = null;
          video.onerror = null;

          introEl.style.opacity = '0';
          introEl.style.pointerEvents = 'none';

          setTimeout(() => {
            try {
              video.pause();
              video.currentTime = 0;
            } catch (e) {}
            introEl.style.display = 'none';
            if (typeof onFinished === 'function') onFinished(userUnmuted);
          }, 450);
        }

        function onKeyDown(e) {
          if (e.key === 'Escape' || e.code === 'Space') {
            e.preventDefault();
            finish();
          }
        }

        function onScreenInteraction() {
          if (video.muted) {
            video.muted = false;
            video.volume = 1.0;
            userUnmuted = true;
          }
        }

        window.addEventListener('keydown', onKeyDown);
        introEl.addEventListener('pointerdown', onScreenInteraction);

        video.onended = () => finish();
        video.onerror = () => finish();

        setTimeout(() => {
          if (!completed) finish();
        }, 13000);

        try {
          video.currentTime = 0;
          video.volume = 1.0;
          video.muted = false;

          const playPromise = video.play();
          if (playPromise && playPromise.then) {
            playPromise.then(() => {
              userUnmuted = true;
            }).catch(() => {
              video.muted = true;
              video.play().catch(() => finish());
            });
          }
        } catch (err) {
          finish();
        }
      }

      function initTV() {
        playTVIntroSequence((unmuted) => {
          initYouTubeLiveStream(unmuted);
          wakeControls();
        });
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initTV);
      } else {
        initTV();
      }

    })();
  </script>
</body>
</html>
