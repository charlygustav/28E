<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>28E TV · Transmisión Lineal 24/7</title>
  <meta name="description" content="28E TV: Televisión lineal en vivo, minimalista y continua con 28E Flow y señal de Donde Crecen las Flores.">
  <!-- Tipografía: Plus Jakarta Sans & JetBrains Mono vía Google Fonts WOFF2 con hinting óptimo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- GSAP y HLS.js -->
  <script src="gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --surface: rgba(12, 16, 14, 0.52);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent-ch1: #10b981;
      --accent-ch2: #a855f7;
      --accent-ch3: #ec4899;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
    }

    /* CONTENEDOR TEATRAL (100% PANTALLA) */
    .tv-cinema-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* PANTALLA PRINCIPAL DE VIDEO */
    .tv-screen-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #tv-video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* CONTENEDOR Y REPRODUCTOR YOUTUBE (SIN INTERFAZ DE YOUTUBE) */
    #tv-youtube-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
      z-index: 2;
      overflow: hidden;
    }

    .yt-frame-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* Ratio 16:9 */
      min-height: 100vh;
      min-width: 177.77vh; /* Ratio 16:9 */
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      pointer-events: none;
    }

    #tv-youtube-container iframe,
    #tv-youtube-player {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      pointer-events: none !important;
      display: block;
    }

    .yt-click-shield {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      pointer-events: auto;
      cursor: default;
    }

    /* CANVAS DE ESTÁTICA / ZAPPING */
    #static-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    /* SCANLINES CRT SUTILES */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
        radial-gradient(circle at 50% 50%, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      background-size: 100% 3px, 100% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .crt-overlay.active {
      opacity: 1;
    }

    /* WATERMARK / MOSCA DE CANAL LIMPIA (SUPERIOR DERECHO - SOLO LOGO) */
    .tv-watermark-container,
    .tv-watermark-pill {
      position: absolute;
      top: 26px;
      right: 32px;
      z-index: 22;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none !important;
      border: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
      pointer-events: none;
    }

    .watermark-logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.95));
      opacity: 0.92;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* OVERLAY MUSICAL FLOTANTE · SIN RECUADRO NI CAJAS (28E FLOW) */
    .mtv-lower-third {
      position: absolute;
      bottom: 84px;
      left: 32px;
      z-index: 25;
      display: none;
      pointer-events: none;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      padding: 6px 12px !important;
      will-change: transform, opacity, filter;
    }

    /* AURA NEGRA / SOMBRA DIFUSA ORGÁNICA DETRÁS DEL TEXTO (SIN FORMA DE RECTÁNGULO) */
    .mtv-lower-third::before {
      content: '';
      position: absolute;
      inset: -22px -45px;
      background: radial-gradient(ellipse 75% 70% at 35% 50%, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.45) 50%, transparent 80%);
      filter: blur(16px);
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
    }

    .mtv-title {
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.95);
    }

    .mtv-artist {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 3px;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    }

    /* ============================================================
       PAQUETE GRÁFICO TELEVISIVO (BROADCAST GRAPHICS PACKAGE)
       Station IDs · Bumpers "Ya Volvemos" · "De Regreso" · "Ya Viene"
       ============================================================ */
    .broadcast-gfx-stage {
      position: absolute;
      inset: 0;
      z-index: 45;
      display: none;
      pointer-events: none;
      overflow: hidden;
      contain: layout style paint;
    }

    .gfx-stage-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(8, 11, 14, 0.74) 0%, rgba(2, 3, 5, 0.94) 100%);
      backdrop-filter: blur(28px) saturate(135%);
      -webkit-backdrop-filter: blur(28px) saturate(135%);
      opacity: 0;
      will-change: opacity;
    }

    .gfx-stage-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .gfx-channel-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      will-change: transform, opacity;
    }

    .gfx-logo-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      opacity: 0;
      overflow: hidden;
      padding: 8px 16px;
      will-change: transform, opacity, filter;
    }

    .gfx-stage-logo {
      height: 76px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 14px 40px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 24px rgba(255, 255, 255, 0.22));
    }

    .gfx-shimmer-sweep {
      position: absolute;
      inset: -20px -60px;
      background: linear-gradient(105deg, transparent 32%, rgba(255, 255, 255, 0.45) 50%, transparent 68%);
      transform: translateX(-160%);
      pointer-events: none;
      mix-blend-mode: overlay;
      will-change: transform;
    }

    .gfx-main-tagline {
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9);
      opacity: 0;
      margin-bottom: 8px;
      will-change: transform, opacity;
    }

    .gfx-sub-tagline {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.68);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0;
      will-change: transform, opacity;
    }



    /* CONSOLA DE AUDITORÍA Y CONTROL EN VIVO: STUDIO GFX DOCK */
    .gfx-studio-dock {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 60;
      background: rgba(10, 13, 16, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), 0 1px 1px rgba(255, 255, 255, 0.08) inset;
      padding: 16px 20px;
      min-width: 660px;
      max-width: 94vw;
      display: none;
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gfx-studio-dock.open {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .studio-dock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .studio-dock-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .studio-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulsePing 2s infinite;
    }

    .studio-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: background 0.15s, color 0.15s;
    }

    .studio-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .studio-channels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .studio-channel-col {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 10px;
    }

    .studio-channel-col .col-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .studio-channel-col.col-uno .col-num {
      background: rgba(16, 185, 129, 0.25);
      color: #10b981;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .studio-channel-col.col-flow .col-num {
      background: rgba(168, 85, 247, 0.25);
      color: #c084fc;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .studio-channel-col.col-dclf .col-num {
      background: rgba(236, 72, 153, 0.25);
      color: #f472b6;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .col-buttons {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .studio-trigger-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, transform 0.1s, border-color 0.15s, color 0.15s;
    }

    .studio-trigger-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .studio-trigger-btn:active {
      transform: translateY(1px);
    }

    /* INDICADOR DE CORTE COMERCIAL (MINIMALISTA, ELEGANTE Y CONFORTABLE) */
    .ad-break-tag {
      position: absolute;
      top: 22px;
      left: 24px;
      height: 28px;
      padding: 0 11px 0 9px;
      background: rgba(14, 18, 22, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      z-index: 22;
      display: none;
      align-items: center;
      gap: 7px;
      user-select: none;
      cursor: default;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      animation: adTagIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ad-break-tag:hover {
      background: rgba(18, 24, 30, 0.85);
      border-color: rgba(245, 158, 11, 0.25);
    }

    .ad-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
      flex-shrink: 0;
      animation: adDotGlow 2.4s ease-in-out infinite;
    }

    @keyframes adDotGlow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.75);
      }
      50% {
        opacity: 0.6;
        transform: scale(0.9);
        box-shadow: 0 0 3px rgba(245, 158, 11, 0.35);
      }
    }

    .ad-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fbbf24;
      line-height: 1;
      text-transform: uppercase;
    }

    .ad-divider {
      width: 1px;
      height: 10px;
      background: rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
    }

    .ad-timer,
    .ad-timer-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .ad-title-text {
      display: none !important;
    }

    @keyframes adTagIn {
      from {
        opacity: 0;
        transform: translateY(-5px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }



    /* ════════════════════════════════════════════
       FLOATING HUD (AUTO-HIDE EN INACTIVIDAD)
    ════════════════════════════════════════════ */
    .floating-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .floating-hud * {
      pointer-events: auto;
    }

    .floating-hud.idle-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
    }

    .floating-hud.idle-hidden * {
      pointer-events: none;
    }

    /* ════════════════════════════════════════════
       TOP BAR: APPLE DYNAMIC ISLAND MINIMALISTA
       ════════════════════════════════════════════ */
    .hud-top-island {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      height: 44px;
      background: rgba(8, 11, 13, 0.76);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0 8px 0 16px;
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      pointer-events: auto;
      user-select: none;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .hud-top-island:hover {
      background: rgba(12, 16, 20, 0.88);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* BRAND / LIVE */
    .top-brand-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: default;
      flex-shrink: 0;
    }

    .live-dot-ping {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.85);
      animation: pulseLive 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.85); }
      50% { opacity: 0.45; transform: scale(0.85); box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
    }

    .top-brand-label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      line-height: 1;
    }

    .top-brand-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    /* SELECTOR DE CANALES (SEGMENTED DOCK) */
    .top-channels-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .top-ch-btn {
      background: transparent;
      border: none;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .top-ch-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .top-ch-btn:active {
      transform: scale(0.96);
    }

    .top-ch-btn.active {
      color: #ffffff;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .top-ch-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 0.02em;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      transition: all 0.2s ease;
    }

    .top-ch-btn.active .top-ch-badge.ch-1,
    .top-ch-btn[data-ch="1"].active .top-ch-badge {
      background: var(--accent-ch1);
      color: #021a0e;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .top-ch-btn.active .top-ch-badge.ch-2,
    .top-ch-btn[data-ch="2"].active .top-ch-badge {
      background: var(--accent-ch2);
      color: #120520;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .top-ch-btn.active .top-ch-badge.ch-3,
    .top-ch-btn[data-ch="3"].active .top-ch-badge {
      background: var(--accent-ch3);
      color: #1a0510;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }

    .top-ch-name {
      letter-spacing: -0.01em;
    }

    /* ACCIONES (GUÍA & VAULT) */
    .top-actions-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .top-action-btn {
      background: transparent;
      border: none;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11.5px;
      font-weight: 500;
      font-family: var(--font-sans);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .top-action-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .top-action-btn:active {
      transform: scale(0.95);
    }

    .top-action-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.8;
      flex-shrink: 0;
    }

    /* ════════════════════════════════════════════
       BOTTOM HUD BAR — REDESIGN MINIMALISTA
    ════════════════════════════════════════════ */
    .hud-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: rgba(8, 11, 10, 0.72);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 22px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255,255,255,0.04) inset;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .hud-bottom-bar:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* INFO SECTION — izquierda */
    .bottom-info-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
      padding: 11px 18px;
    }

    .bottom-ch-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.03em;
      color: #021a0e;
      background: var(--accent-ch1);
      padding: 5px 9px;
      border-radius: 9px;
      line-height: 1;
      flex-shrink: 0;
      transition: background 0.35s cubic-bezier(0.16,1,0.3,1), color 0.35s ease;
    }
    .bottom-ch-badge.ch-2 { background: var(--accent-ch2); color: #120520; }
    .bottom-ch-badge.ch-3 { background: var(--accent-ch3); color: #1a0510; }

    .bottom-text-wrap {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .bottom-program-badge {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
      line-height: 1;
    }

    .bottom-show-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .bottom-show-sub {
      font-size: 10.5px;
      color: rgba(148, 163, 184, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    /* DIVIDER */
    .hud-bar-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    /* CONTROLES — derecha */
    .bottom-controls-group {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      padding: 6px 10px;
    }

    /* Botones de control individuales */
    .hud-tool-btn {
      background: transparent;
      border: none;
      color: rgba(203, 213, 225, 0.6);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s cubic-bezier(0.16,1,0.3,1);
      position: relative;
    }

    .hud-tool-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
    }

    .hud-tool-btn:active {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.12);
    }

    .hud-tool-btn.active {
      color: var(--accent-ch1);
    }
    .hud-tool-btn.active:hover {
      background: rgba(16, 185, 129, 0.1);
    }

    .hud-tool-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* VOLUME — grupo compacto */
    .vol-slider-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px;
    }

    /* Custom range slider — minimalista */
    .vol-slider-input {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .vol-slider-input:hover {
      background: rgba(255,255,255,0.22);
    }
    .vol-slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.12s cubic-bezier(0.16,1,0.3,1), box-shadow 0.15s ease;
    }
    .vol-slider-input::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.18);
    }
    .vol-slider-input::-webkit-slider-thumb:active {
      transform: scale(1.1);
    }
    .vol-slider-input::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }
    .vol-slider-input::-moz-range-track {
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      height: 3px;
    }

    /* ==========================================
       GUÍA EPG · TV LINEAL STYLE
       ========================================== */
    .epg-modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .epg-modal-wrap.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* PANEL PRINCIPAL */
    .epg-card {
      width: 100%;
      max-width: 580px;
      background: rgba(10, 13, 18, 0.96);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.9);
    }

    /* CABECERA */
    .epg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .epg-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .epg-header-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .epg-live-pill {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .epg-live-pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ef4444;
      animation: epgLivePulse 1.6s ease-in-out infinite;
    }

    @keyframes epgLivePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .epg-clock {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }

    .epg-x-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      color: #64748b;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .epg-x-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .epg-x-btn:active { transform: scale(0.94); }

    /* FILAS DE CANAL */
    .epg-channel-list {
      display: flex;
      flex-direction: column;
    }

    .epg-ch-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: background 0.12s ease;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      position: relative;
    }

    .epg-ch-row:last-child {
      border-bottom: none;
    }

    .epg-ch-row:hover {
      background: rgba(255,255,255,0.025);
    }

    .epg-ch-row.is-tuned {
      background: rgba(255,255,255,0.03);
    }

    /* Badge número de canal */
    .epg-ch-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      min-width: 34px;
      text-align: center;
      padding: 5px 6px;
      border-radius: 7px;
      flex-shrink: 0;
    }

    /* Contenido central de la fila */
    .epg-ch-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .epg-ch-now {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .epg-ch-label {
      font-size: 8.5px;
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .epg-ch-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .epg-ch-sub {
      font-size: 11px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de progreso del programa actual */
    .epg-prog-bar {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .epg-prog-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 1s linear;
    }

    /* Próximo */
    .epg-next-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
    }

    .epg-next-row span {
      color: #64748b;
      flex-shrink: 0;
    }

    .epg-next-title {
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* Indicador derecho de sintonización */
    .epg-ch-side {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
    }

    .epg-on-air {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 3px 8px;
      border-radius: 5px;
    }

    .epg-tune-hint {
      font-size: 10.5px;
      color: #334155;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .epg-ch-row:hover .epg-tune-hint {
      opacity: 1;
    }

    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hud-top-island {
        padding: 2px 4px;
        gap: 2px;
      }
      .top-ch-btn {
        padding: 4px 7px;
        font-size: 11px;
      }
      .top-action-btn span {
        display: none;
      }
      .hud-bottom-bar {
        border-radius: 18px;
      }
      .bottom-info-group {
        padding: 10px 14px;
      }
      .bottom-controls-group {
        padding: 5px 8px;
      }
      .vol-slider-input {
        width: 52px;
      }
      .tv-watermark-container,
      .tv-watermark-pill {
        top: 16px;
        right: 18px;
      }
      .watermark-logo-img {
        height: 28px;
      }
      .ad-break-tag {
        top: 16px;
        left: 16px;
        height: 26px;
        padding: 0 10px 0 8px;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR CINEMATOGRÁFICO TEATRAL -->
  <main class="tv-cinema-stage" id="cinema-stage">
    
    <!-- PANTALLA DE EMISIÓN -->
    <div class="tv-screen-viewport" id="tv-screen">
      
      <!-- Video Player Nativo HLS / MP4 -->
      <video id="tv-video-player" playsinline muted autoplay preload="auto"></video>

      <!-- YouTube Player (Encapsulado para ocultar UI nativa) -->
      <div id="tv-youtube-container">
        <div class="yt-frame-wrapper">
          <div id="tv-youtube-player"></div>
        </div>
        <div class="yt-click-shield" id="yt-click-shield"></div>
      </div>

      <!-- Canvas de Estática Zapping -->
      <canvas id="static-canvas"></canvas>

      <!-- Scanlines CRT -->
      <div class="crt-overlay" id="crt-overlay"></div>

      <!-- Watermark / Mosca de Canal Oficial (Solo Logo Flotante) -->
      <div class="tv-watermark-container" id="tv-watermark">
        <img id="watermark-logo-img" src="assets/logos/logo_28e_uno.svg" alt="Canal Logo" class="watermark-logo-img">
      </div>

      <!-- Indicador de Publicidad (Ultra-Minimalista & Confortable) -->
      <div class="ad-break-tag" id="ad-break-tag">
        <span class="ad-dot"></span>
        <span class="ad-label">PUBLICIDAD</span>
        <span class="ad-divider"></span>
        <span class="ad-timer" id="ad-break-timer">0s</span>
        <span class="ad-title-text" id="ad-break-name" style="display: none;">Espacio Comercial</span>
      </div>

      <!-- Music Lower Third (Canal 2: 28E Flow) -->
      <div class="mtv-lower-third" id="mtv-lower-third">
        <div class="mtv-title" id="mtv-title"></div>
        <div class="mtv-artist" id="mtv-artist"></div>
      </div>

      <!-- ESCENARIO PRINCIPAL DE PAQUETE GRÁFICO (STATION IDS, YA VOLVEMOS, DE REGRESO) -->
      <div class="broadcast-gfx-stage" id="broadcast-gfx-stage" aria-hidden="true">
        <div class="gfx-stage-backdrop" id="gfx-stage-backdrop"></div>
        <div class="gfx-stage-content" id="gfx-stage-content">
          <div class="gfx-channel-badge" id="gfx-channel-badge">01 · 28E UNO</div>
          <div class="gfx-logo-wrapper" id="gfx-logo-wrapper">
            <img src="assets/logos/logo_28e_uno.svg" alt="Canal Logo" id="gfx-stage-logo" class="gfx-stage-logo" />
            <div class="gfx-shimmer-sweep" id="gfx-shimmer-sweep"></div>
          </div>
          <div class="gfx-main-tagline" id="gfx-main-tagline">TRANSMISIÓN PRINCIPAL</div>
          <div class="gfx-sub-tagline" id="gfx-sub-tagline">CINE · SERIES · VAULT DE ENTRETENIMIENTO</div>
        </div>
      </div>



      <!-- CONSOLA DE AUDITORÍA Y CONTROL EN VIVO: STUDIO GFX DOCK -->
      <div class="gfx-studio-dock" id="gfx-studio-dock" aria-label="Consola de Paquete Gráfico">
        <div class="studio-dock-header">
          <div class="studio-dock-title">
            <span class="studio-pulse"></span>
            <span>STUDIO GFX · PAQUETE GRÁFICO TELEVISIVO</span>
          </div>
          <button class="studio-close-btn" id="btn-close-gfx-studio" title="Cerrar Consola (Esc o B)">✕</button>
        </div>
        <div class="studio-channels-grid">
          <!-- CANAL 01: 28E UNO -->
          <div class="studio-channel-col col-uno">
            <div class="col-header">
              <span class="col-num num-1">01</span>
              <span class="col-name">28E Uno</span>
            </div>
            <div class="col-buttons">
              <button class="studio-trigger-btn" data-ch="1" data-type="station_id">Station ID (4s)</button>
              <button class="studio-trigger-btn" data-ch="1" data-type="break_in">Ya Volvemos (3s)</button>
              <button class="studio-trigger-btn" data-ch="1" data-type="break_out">De Regreso (2.5s)</button>
              <button class="studio-trigger-btn" data-ch="1" data-type="up_next">Ya Viene (6s)</button>
            </div>
          </div>
          <!-- CANAL 02: 28E FLOW -->
          <div class="studio-channel-col col-flow">
            <div class="col-header">
              <span class="col-num num-2">02</span>
              <span class="col-name">28E Flow</span>
            </div>
            <div class="col-buttons">
              <button class="studio-trigger-btn" data-ch="2" data-type="station_id">Station ID (4s)</button>
              <button class="studio-trigger-btn" data-ch="2" data-type="break_in">Ya Volvemos (3s)</button>
              <button class="studio-trigger-btn" data-ch="2" data-type="break_out">De Regreso (2.5s)</button>
              <button class="studio-trigger-btn" data-ch="2" data-type="up_next">Ya Viene (6s)</button>
            </div>
          </div>
          <!-- CANAL 03: DCLF TV -->
          <div class="studio-channel-col col-dclf">
            <div class="col-header">
              <span class="col-num num-3">03</span>
              <span class="col-name">DCLF TV</span>
            </div>
            <div class="col-buttons">
              <button class="studio-trigger-btn" data-ch="3" data-type="station_id">Station ID (4s)</button>
              <button class="studio-trigger-btn" data-ch="3" data-type="break_in">Ya Volvemos (3s)</button>
              <button class="studio-trigger-btn" data-ch="3" data-type="break_out">De Regreso (2.5s)</button>
              <button class="studio-trigger-btn" data-ch="3" data-type="up_next">Ya Viene (6s)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- FLOATING HUD OVERLAY (AUTO-HIDE EN INACTIVIDAD) -->
      <div class="floating-hud" id="floating-hud">

        <!-- BARRA SUPERIOR: ULTRA-MINIMALISTA (DYNAMIC ISLAND) -->
        <header class="hud-top-island" id="hud-top-bar">
          
          <!-- Brand & Live Indicator -->
          <div class="top-brand-group" title="28E Emisión en Directo">
            <span class="live-dot-ping"></span>
            <span class="top-brand-label">28E</span>
          </div>

          <span class="top-brand-sep" aria-hidden="true"></span>

          <!-- Selector de Canales (Dock Segmentado) -->
          <nav class="top-channels-group" id="top-channels-group" aria-label="Canales de TV">
            <button class="top-ch-btn active" data-ch="1" id="pill-ch-1" title="Canal 01 · 28E Uno [Tecla 1]">
              <span class="top-ch-badge ch-1">01</span>
              <span class="top-ch-name">Uno</span>
            </button>
            <button class="top-ch-btn" data-ch="2" id="pill-ch-2" title="Canal 02 · 28E Flow [Tecla 2]">
              <span class="top-ch-badge ch-2">02</span>
              <span class="top-ch-name">Flow</span>
            </button>
            <button class="top-ch-btn" data-ch="3" id="pill-ch-3" title="Canal 03 · DCLF TV [Tecla 3]">
              <span class="top-ch-badge ch-3">03</span>
              <span class="top-ch-name">DCLF</span>
            </button>
          </nav>

          <span class="top-brand-sep" aria-hidden="true"></span>

          <!-- Acciones Rápidas -->
          <div class="top-actions-group">
            <button class="top-action-btn" id="btn-epg" title="Guía de Canales [Tecla G]">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
              <span>Guía</span>
            </button>
            <a href="index.html" class="top-action-btn" title="Volver al Vault [Esc]">
              <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
              <span>Vault</span>
            </a>
          </div>

        </header>

    (function () {

      // ==========================================
      // 1. MOTOR DE AUDIO SINTETIZADO (Web Audio)

      const AudioFX = {
        ctx: null,
        init: function () {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
        },
        playStaticBurst: function () {
          this.init();
          if (!this.ctx) return;
          try {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const bufferSize = Math.floor(this.ctx.sampleRate * 0.1);
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1100;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
          } catch (e) {}
        },
        playBeep: function (freq = 900) {
          this.init();
          if (!this.ctx) return;
          try {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.04);
          } catch (e) {}
        },
        playStationIdSound: function (channelId) {
          this.init();
          if (!this.ctx) return;
          try {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            
            if (channelId === 1) {
              // 28E UNO: Mnemónico orquestal cinematográfico estilo Apple TV / HBO (Acorde en Do rico y profundo)
              const chord = [65.41, 130.81, 196.00, 261.63, 329.63]; // C2, C3, G3, C4, E4
              chord.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                
                osc.type = i < 2 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(freq, now);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.exponentialRampToValueAtTime(2600, now + 0.6);
                filter.frequency.exponentialRampToValueAtTime(800, now + 3.2);

                const volume = (i === 0 ? 0.08 : (i === 1 ? 0.06 : 0.035));
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.25);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 3.5);
              });
            } else if (channelId === 2) {
              // 28E FLOW: Pulso rítmico moderno estilo COLORS / Apple Music (808 Sub-Bass Drop + Micro-click)
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(160, now);
              osc.frequency.exponentialRampToValueAtTime(42, now + 0.22);

              gain.gain.setValueAtTime(0.12, now);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 2.3);

              // Click de vinilo / micro-transiente
              const clickOsc = this.ctx.createOscillator();
              const clickGain = this.ctx.createGain();
              clickOsc.type = 'triangle';
              clickOsc.frequency.setValueAtTime(3200, now);
              clickOsc.frequency.exponentialRampToValueAtTime(400, now + 0.025);
              clickGain.gain.setValueAtTime(0.08, now);
              clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
              clickOsc.connect(clickGain);
              clickGain.connect(this.ctx.destination);
              clickOsc.start(now);
              clickOsc.stop(now + 0.03);
            } else if (channelId === 3) {
              // DCLF TV: Arpegio de campanillas botánicas zen (Pentatónica cristalina Mi-Sol#-Si-Mi)
              const notes = [659.25, 830.61, 987.77, 1318.51];
              notes.forEach((freq, idx) => {
                const noteTime = now + (idx * 0.18);
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, noteTime);

                gain.gain.setValueAtTime(0.0001, noteTime);
                gain.gain.linearRampToValueAtTime(0.05, noteTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 2.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(noteTime);
                osc.stop(noteTime + 2.5);
              });
            }
          } catch (e) {}
        },
        playBumperSound: function (type, channelId) {
          this.init();
          if (!this.ctx) return;
          try {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const now = this.ctx.currentTime;
            if (type === 'break_in') {
              // Aviso suave de corte publicitario: dos notas descendentes
              [880, 587.33].forEach((freq, idx) => {
                const t = now + (idx * 0.16);
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.045, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.95);
              });
            } else if (type === 'break_out') {
              // Retorno de publicidad: dos notas ascendentes
              [587.33, 880].forEach((freq, idx) => {
                const t = now + (idx * 0.14);
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.045, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 1.15);
              });
            } else if (type === 'up_next') {
              // Micro-aviso sutil estilo iOS/Apple
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(1046.5, now);
              gain.gain.setValueAtTime(0.03, now);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.36);
            }
          } catch (e) {}
        }
      };

        const w = staticCanvas.width;
        const h = staticCanvas.height;
        const imgData = staticCtx.createImageData(w, h);
        const buffer = new Uint32Array(imgData.data.buffer);
        const len = buffer.length;
        for (let i = 0; i < len; i++) {
          const val = (Math.random() * 255) | 0;
          buffer[i] = (255 << 24) | (val << 16) | (val << 8) | val;
        }
        staticCtx.putImageData(imgData, 0, 0);
      }

      // ==========================================

      // ==========================================
      function getChannelTimelineState(channelId) {
        const channel = CHANNELS[channelId];
        const totalDuration = channel.schedule.reduce((acc, item) => acc + item.duration, 0);
        
        const now = new Date();
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const elapsedToday = Math.floor((now.getTime() - startOfDay) / 1000);
        
        const positionInLoop = elapsedToday % totalDuration;
        
        let accumulated = 0;
        for (let i = 0; i < channel.schedule.length; i++) {
          const item = channel.schedule[i];
          if (positionInLoop >= accumulated && positionInLoop < accumulated + item.duration) {
            return {
              item: item,
              index: i,
              seekSeconds: positionInLoop - accumulated,
              totalDuration: item.duration,
              remainingSeconds: item.duration - (positionInLoop - accumulated)
            };
          }
          accumulated += item.duration;
        }

        return {
          item: channel.schedule[0],
          index: 0,
          seekSeconds: 0,
          totalDuration: channel.schedule[0].duration,
          remainingSeconds: channel.schedule[0].duration
        };
      }

      function updatePlayback(forceReload = false) {

            playBumper('break_out', currentChannelId);
          }
        }
        previousItemWasAd = item.isAd;


        // Si cambió el item al aire (por cambio de índice en la parrilla, canal o recarga)
        const isNewItem = forceReload ||
                          activeChannelPlaying !== currentChannelId ||
                          activeItemIndex !== state.index ||
                          !activeItem ||
                          activeItem !== item ||
                          activeItem.src !== item.src;

        if (isNewItem) {
          activeItem = item;
          activeItemIndex = state.index;
          activeChannelPlaying = currentChannelId;

          if (item.type === 'youtube' && item.youtubeId) {
            videoEl.pause();

            videoEl.style.display = 'block';
            playNativeVideo(item.src, state.seekSeconds);
          }
        }
      }

      function playNativeVideo(src, seekSeconds) {
        if (!src) return;

        if (src.includes('.m3u8')) {
          if (Hls.isSupported()) {
            if (hlsInstance) hlsInstance.destroy();
            hlsInstance = new Hls({ enableWorker: true });
            hlsInstance.loadSource(src);
            hlsInstance.attachMedia(videoEl);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
              if (seekSeconds > 0) {
                try { videoEl.currentTime = seekSeconds; } catch (e) {}
              }
              videoEl.play().catch(() => {});
            });
          } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = src;
            if (seekSeconds > 0) {
              try { videoEl.currentTime = seekSeconds; } catch (e) {}
            }
            videoEl.play().catch(() => {});
          }
        } else {
          if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
          }

          const encodedSrc = encodeURI(src);
          const isSameSource = videoEl.getAttribute('data-active-src') === src;

          videoEl.volume = parseFloat(volumeSlider.value);
          videoEl.muted = isMuted;

          if (!isSameSource) {
            videoEl.setAttribute('data-active-src', src);
            videoEl.src = encodedSrc;
            videoEl.load();

            const onMetadata = function () {
              videoEl.removeEventListener('loadedmetadata', onMetadata);
              if (seekSeconds > 0 && seekSeconds < (videoEl.duration || 9999)) {
                try { videoEl.currentTime = seekSeconds; } catch (e) {}
              }
              const p = videoEl.play();
              if (p !== undefined) {
                p.catch(() => {
                  videoEl.muted = true;
                  isMuted = true;
                  videoEl.play().catch(() => {});
                });
              }
            };

            if (videoEl.readyState >= 1) {
              onMetadata();
            } else {
              videoEl.addEventListener('loadedmetadata', onMetadata, { once: true });
            }
          } else {
            if (seekSeconds > 0 && Math.abs(videoEl.currentTime - seekSeconds) > 3) {
              try { videoEl.currentTime = seekSeconds; } catch (e) {}
            }
          }

          const p = videoEl.play();
          if (p !== undefined) {
            p.catch(() => {
              videoEl.muted = true;
              isMuted = true;
              videoEl.play().catch(() => {});
            });
          }
        }
      }

      function playYouTubeItem(youtubeId, seekSeconds) {
        const ytWrapper = document.getElementById('tv-youtube-container');
        if (ytWrapper) ytWrapper.style.display = 'block';

        if (!ytReady) {
          loadYouTubeAPI(() => {
            initYTPlayer(youtubeId, seekSeconds);
          });
        } else if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
          ytPlayer.loadVideoById({
            videoId: youtubeId,
            startSeconds: Math.floor(seekSeconds)
          });
          try {
            if (typeof ytPlayer.unloadModule === 'function') {
              ytPlayer.unloadModule('captions');
              ytPlayer.unloadModule('cc');
            }
          } catch (e) {}
          if (isMuted) {
            ytPlayer.mute();
            ytPlayer.setVolume(0);
          } else {
            ytPlayer.unMute();
            ytPlayer.setVolume(parseFloat(volumeSlider.value) * 100);
          }
          ytPlayer.playVideo();
        }
      }

      function loadYouTubeAPI(callback) {
        if (window.YT && window.YT.Player) {
          ytReady = true;
          callback();
          return;
        }
        window.onYouTubeIframeAPIReady = function () {
          ytReady = true;
          callback();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(tag, first);
      }

      function initYTPlayer(youtubeId, seekSeconds) {
        ytPlayer = new YT.Player('tv-youtube-player', {
          height: '100%',
          width: '100%',
          videoId: youtubeId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            rel: 0,
            iv_load_policy: 3,
            cc_load_policy: 0,
            playsinline: 1,
            start: Math.floor(seekSeconds),
            origin: window.location.origin
          },
          events: {
            onReady: function (event) {
              try {
                if (typeof event.target.unloadModule === 'function') {
                  event.target.unloadModule('captions');
                  event.target.unloadModule('cc');
                }
              } catch (e) {}

              if (isMuted) {
                event.target.mute();
                event.target.setVolume(0);
              } else {
                event.target.unMute();
                event.target.setVolume(parseFloat(volumeSlider.value) * 100);
              }
              event.target.playVideo();
            },
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.ENDED) {
                updatePlayback(true);
              }
            }
          }
        });
      }

      // ==========================================
      // 6. AUTO-HIDE HUD FLOTANTE (EXPERIENCIA CINE)
      // ==========================================
      function wakeHud() {
        if (!floatingHud) return;
        if (floatingHud.classList.contains('idle-hidden')) {
          floatingHud.classList.remove('idle-hidden');
          if (window.gsap) {
            gsap.to(floatingHud, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' });
          }
        }
        if (idleTimeout) clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
          if (!epgModal || !epgModal.classList.contains('open')) {
            if (window.gsap) {
              gsap.to(floatingHud, { opacity: 0, y: -4, duration: 0.45, ease: 'power2.in', onComplete: () => {
                if (floatingHud) floatingHud.classList.add('idle-hidden');
              }});
            } else {
              if (floatingHud) floatingHud.classList.add('idle-hidden');
            }
          }
        }, 3500);
      }

      window.addEventListener('mousemove', wakeHud);
      window.addEventListener('touchstart', wakeHud);
      window.addEventListener('click', wakeHud);

      // Heartbeat cada segundo
      setInterval(() => {
        updatePlayback(false);
      }, 1000);

      // ==========================================
      // 7. GUÍA EPG · TV LINEAL
      // ==========================================

      function renderEPG() {
        const list = document.getElementById('epg-channel-list');
        const clock = document.getElementById('epg-live-clock');
        if (!list) return;

        // Reloj
        if (clock) {
          clock.textContent = new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }

        list.innerHTML = Object.keys(CHANNELS).map(id => {
          const chId = parseInt(id);
          const ch   = CHANNELS[chId];
          const st   = getChannelTimelineState(chId);
          const item = st.item;
          const isTuned = (chId === currentChannelId);

          // Título del programa en curso
          const nowTitle = item.isAd
            ? 'Pausa Comercial'
            : (item.artist ? `${item.title} — ${item.artist}` : item.title);

          const nowSub = item.isAd
            ? (item.program || ch.name)
            : (item.program || ch.sub);

          // Próximo
          const nextIdx  = (st.index + 1) % ch.schedule.length;
          const nextItem = ch.schedule[nextIdx];
          const nextTitle = nextItem.isAd
            ? 'Pausa Comercial'
            : (nextItem.artist ? `${nextItem.title} — ${nextItem.artist}` : nextItem.title);

          // Progreso (0-100)
          const pct = Math.min(100, Math.max(0, (st.seekSeconds / st.totalDuration) * 100));

          return `
            <div class="epg-ch-row ${isTuned ? 'is-tuned' : ''}" onclick="window.__tune(${chId})">
              <div class="epg-ch-badge" style="background:${ch.accent}18; color:${ch.accent}; border:1px solid ${ch.accent}30;">${ch.number}</div>

              <div class="epg-ch-body">
                <div class="epg-ch-now">
                  <div class="epg-ch-label" style="color:${ch.accent};">${item.isAd ? '■ PUBLICIDAD' : '● AHORA'}</div>
                  <div class="epg-ch-title">${nowTitle}</div>
                  <div class="epg-ch-sub">${nowSub}</div>
                </div>
                <div class="epg-prog-bar">
                  <div class="epg-prog-fill" style="width:${pct.toFixed(1)}%; background:${ch.accent};"></div>
                </div>
                <div class="epg-next-row">
                  <span>A continuación ›</span>
                  <span class="epg-next-title">${nextTitle}</span>
                </div>
              </div>

              <div class="epg-ch-side">
                ${isTuned
                  ? '<span class="epg-on-air">● ON AIR</span>'
                  : '<span class="epg-tune-hint">Ver ›</span>'
                }
              </div>
            </div>
          `;
        }).join('');
      }

      window.__playItem = function (chId, itemIdx) {
        // kept for compatibility but not shown in guide
        currentChannelId = chId;
        const ch = CHANNELS[chId];
        if (!ch || !ch.schedule || !ch.schedule[itemIdx]) return;
        const targetItem = ch.schedule[itemIdx];
        activeItem = targetItem;
        activeItemIndex = itemIdx;
        activeChannelPlaying = chId;
        tuneToChannel(chId);
        if (targetItem.type === 'youtube' && targetItem.youtubeId) {
          videoEl.pause(); videoEl.style.display = 'none';
          playYouTubeItem(targetItem.youtubeId, 0);
        } else {
          videoEl.style.display = 'block';
          playNativeVideo(targetItem.src, 0);
        }
        epgModal.classList.remove('open');
        wakeHud();
      };

      // 8. CONTROLES Y EVENT LISTENERS
      // ==========================================
      document.querySelectorAll('.top-ch-btn, .pill-ch').forEach(btn => {
        btn.addEventListener('click', function () {
          const ch = parseInt(this.dataset.ch);
          tuneToChannel(ch);
        });
      });

      document.getElementById('btn-next-ch').addEventListener('click', () => {
        const next = currentChannelId >= 3 ? 1 : currentChannelId + 1;
        tuneToChannel(next);
      });

      document.getElementById('btn-prev-ch').addEventListener('click', () => {
        const prev = currentChannelId <= 1 ? 3 : currentChannelId - 1;
        tuneToChannel(prev);
      });

      // Mute / Volumen Dinámico
      function updateVolumeIcon(val) {
        const icon = document.getElementById('icon-vol');
        if (!icon) return;
        if (isMuted || val === 0) {
          icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        } else if (val < 0.4) {
          icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else {
          icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        }
      }

      btnMute.addEventListener('click', () => {
        isMuted = !isMuted;
        videoEl.muted = isMuted;
        if (isMuted) {
          updateVolumeIcon(0);
          if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
        } else {
          const val = parseFloat(volumeSlider.value) > 0 ? parseFloat(volumeSlider.value) : 0.65;
          volumeSlider.value = val;
          videoEl.volume = val;
          updateVolumeIcon(val);
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            ytPlayer.unMute();
            ytPlayer.setVolume(val * 100);
          }
        }
        AudioFX.playBeep();
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        videoEl.volume = val;
        isMuted = (val === 0);
        videoEl.muted = isMuted;
        updateVolumeIcon(val);
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
          if (val > 0) ytPlayer.unMute();
          else ytPlayer.mute();
          ytPlayer.setVolume(val * 100);
        }
      });



      document.getElementById('tv-screen').addEventListener('click', () => {
        if (isMuted) {
          btnMute.click();
        }
        wakeHud();
      });

      // CRT Scanlines
      btnCrt.addEventListener('click', () => {
        crtOverlay.classList.toggle('active');
        btnCrt.classList.toggle('active');
        AudioFX.playBeep();
      });

      // Fullscreen
      btnFullscreen.addEventListener('click', () => {
        const stage = document.getElementById('cinema-stage');
        if (!document.fullscreenElement) {
          if (stage.requestFullscreen) stage.requestFullscreen();
          else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
        AudioFX.playBeep();
      });

      // Modal EPG con actualización viva cada segundo
      let selectedEpgChannel = currentChannelId;
      let epgLiveInterval = null;

      // window.__tune — called from onclick in renderEPG rows
      window.__tune = function(chId) {
        if (!CHANNELS[chId]) return;
        currentChannelId = chId;
        tuneToChannel(chId);
        epgModal.classList.remove('open');
        if (epgLiveInterval) { clearInterval(epgLiveInterval); epgLiveInterval = null; }
        wakeHud();
      };

      btnEpg.addEventListener('click', () => {
        selectedEpgChannel = currentChannelId;
        renderEPG();
        epgModal.classList.add('open');
        if (window.gsap) {
          gsap.fromTo('#epg-card', { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: 'power3.out' });
        }
        AudioFX.playBeep();
        if (epgLiveInterval) clearInterval(epgLiveInterval);
        epgLiveInterval = setInterval(() => {
          if (epgModal.classList.contains('open')) {
            renderEPG();
          } else {
            clearInterval(epgLiveInterval);
            epgLiveInterval = null;
          }
        }, 1000);
      });

      btnCloseEpg.addEventListener('click', () => {
        epgModal.classList.remove('open');
        if (epgLiveInterval) {
          clearInterval(epgLiveInterval);
          epgLiveInterval = null;
        }
        AudioFX.playBeep();
      });

      epgModal.addEventListener('click', (e) => {
        if (e.target === epgModal) {
          epgModal.classList.remove('open');
          if (epgLiveInterval) {
            clearInterval(epgLiveInterval);
            epgLiveInterval = null;
          }
        }
      });

      // Controles de Consola Studio GFX
      if (btnGfxStudio) {
        btnGfxStudio.addEventListener('click', () => {
          toggleStudioDock();
        });
      }
      if (btnCloseGfxStudio) {
        btnCloseGfxStudio.addEventListener('click', () => {
          toggleStudioDock(false);
        });
      }
      document.querySelectorAll('.studio-trigger-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          const ch = parseInt(this.dataset.ch) || currentChannelId;
          const type = this.dataset.type || 'station_id';
          playRealBumper(ch, type);
        });
      });

      // Atajos de teclado y Control Remoto Smart TV (webOS / Tizen / Android TV)
      window.addEventListener('keydown', (e) => {
        if (['1', '2', '3'].includes(e.key)) {
          if (epgModal && epgModal.classList.contains('open')) {
            window.__selectEpgChannel(parseInt(e.key));
          } else {
            tuneToChannel(parseInt(e.key));
          }
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'ChannelUp' || e.key === 'PageUp') {
          document.getElementById('btn-next-ch').click();
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ChannelDown' || e.key === 'PageDown') {
          document.getElementById('btn-prev-ch').click();
        } else if (e.key === 'Enter' || e.key === 'MediaPlayPause' || e.key === 'Play' || e.key === ' ') {
          if (isMuted) btnMute.click();
        } else if (e.key.toLowerCase() === 'm') {
          btnMute.click();
        } else if (e.key.toLowerCase() === 'f') {
          btnFullscreen.click();
        } else if (e.key.toLowerCase() === 'c') {
          btnCrt.click();
        } else if (e.key.toLowerCase() === 'g') {
          btnEpg.click();
        } else if (e.key.toLowerCase() === 'b') {
          toggleStudioDock();
        } else if (e.key === 'Escape') {
          if (gfxStudioDock && gfxStudioDock.classList.contains('open')) {
            toggleStudioDock(false);
          } else if (epgModal && epgModal.classList.contains('open')) {
            epgModal.classList.remove('open');
          }
        }
      });

      videoEl.addEventListener('ended', () => {
        updatePlayback(true);
      });

      videoEl.addEventListener('error', (e) => {
        console.warn('Playback error detected on native video element, auto-advancing:', e);
        setTimeout(() => updatePlayback(true), 1200);
      });

      // Arranque con volumen al 0 (muted) para reproducción garantizada
      function startTV() {
        updateVolumeIcon(0);
        const urlParams = new URLSearchParams(window.location.search);
        const chParam = parseInt(urlParams.get('ch'));
        const initialCh = (chParam >= 1 && chParam <= 3) ? chParam : 1;
        tuneToChannel(initialCh);
        wakeHud();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', startTV);
      } else {
        startTV();
      }

    })();
  </script>
</body>
</html>
