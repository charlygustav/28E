  <style>

    .yt-frame-wrapper {

      position: absolute;

    /* UNMUTE TOAST / PILL HINT */
    .unmute-hint {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;

      padding: 10px 20px;

      font-weight: 600;

      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.3s ease, transform 0.3s ease;
      animation: hintBounce 2.5s infinite ease-in-out;
    }

    .unmute-hint.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    @keyframes hintBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }

    /* FLOATING HUD OVERLAY (AUTO-HIDE EN INACTIVIDAD) */

<body>

  <script>
    (function () {
      'use strict';

      const YOUTUBE_STREAM_ID = 'Gfnj_4BU9cs';

      let ytPlayer = null;
      let ytReady = false;
      let isMuted = true;
      let currentVolume = 0.65;
      let isPlaying = true;
      let idleTimeout = null;

      // Elementos DOM
      const floatingHud = document.getElementById('floating-hud');
      const volumeSlider = document.getElementById('volume-slider');
      const btnMute = document.getElementById('btn-mute');
      const btnPlayPause = document.getElementById('btn-play-pause');
      const btnCrt = document.getElementById('btn-crt');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const crtOverlay = document.getElementById('crt-overlay');
      const iconVol = document.getElementById('icon-vol');
      const iconPlayPause = document.getElementById('icon-play-pause');
      const unmuteHint = document.getElementById('unmute-hint');
      const ytClickShield = document.getElementById('yt-click-shield');

      // ── AUTO-HIDE HUD ──
      function wakeHud() {
        if (!floatingHud) return;
        floatingHud.classList.remove('idle-hidden');
        if (window.gsap) {
          gsap.to(floatingHud, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' });
        }
        if (idleTimeout) clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
          if (window.gsap) {
            gsap.to(floatingHud, {
              opacity: 0,
              y: -4,
              duration: 0.4,
              ease: 'power2.in',
              onComplete: () => {
                if (floatingHud) floatingHud.classList.add('idle-hidden');
              }
            });
          } else {
            if (floatingHud) floatingHud.classList.add('idle-hidden');
          }
        }, 3500);
      }

      window.addEventListener('mousemove', wakeHud);
      window.addEventListener('touchstart', wakeHud);
      window.addEventListener('click', wakeHud);

      // ── ICONOS VOLUMEN ──
      function updateVolumeIcon(vol) {
        if (!iconVol) return;
        if (vol <= 0 || isMuted) {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        } else if (vol < 0.5) {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else {
          iconVol.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        }
      }

      // ── ICONOS PLAY / PAUSE ──
      function updatePlayPauseIcon(playing) {
        if (!iconPlayPause) return;
        if (playing) {
          iconPlayPause.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
          iconPlayPause.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        }
      }

      // ── GESTIÓN DE AUDIO ──
      function setMuteState(muted, customVol = null) {
        isMuted = muted;
        if (customVol !== null) currentVolume = customVol;

        if (isMuted) {
          if (ytPlayer && typeof ytPlayer.mute === 'function') ytPlayer.mute();
          volumeSlider.value = 0;
          updateVolumeIcon(0);
          if (unmuteHint) unmuteHint.classList.remove('hidden');
        } else {
          if (unmuteHint) unmuteHint.classList.add('hidden');
          const targetVol = currentVolume > 0 ? currentVolume : 0.65;
          currentVolume = targetVol;
          volumeSlider.value = targetVol;
          updateVolumeIcon(targetVol);
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            ytPlayer.unMute();
            ytPlayer.setVolume(targetVol * 100);
          }
        }
      }

      btnMute.addEventListener('click', () => {
        setMuteState(!isMuted);
      });

      volumeSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (val === 0) {
          setMuteState(true);
        } else {
          setMuteState(false, val);
        }
      });

      // ── TOGGLE PLAY / PAUSE ──
      function togglePlayPause() {
        if (!ytPlayer) return;
        if (isPlaying) {
          if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
          isPlaying = false;
        } else {
          if (typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
          isPlaying = true;
          if (isMuted) setMuteState(false);
        }
        updatePlayPauseIcon(isPlaying);
      }

      btnPlayPause.addEventListener('click', togglePlayPause);

      // ── CLICK SHIELD ──
      ytClickShield.addEventListener('click', () => {
        if (isMuted) {
          setMuteState(false);
        } else {
          togglePlayPause();
        }
        wakeHud();
      });

      if (unmuteHint) {
        unmuteHint.addEventListener('click', () => {
          setMuteState(false);
          wakeHud();
        });
      }

      // ── FILTRO CRT ──
      btnCrt.addEventListener('click', () => {
        crtOverlay.classList.toggle('active');
        btnCrt.classList.toggle('active', crtOverlay.classList.contains('active'));
      });

      // ── PANTALLA COMPLETA ──
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.classList.add('active');
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          btnFullscreen.classList.remove('active');
        }
      }

      btnFullscreen.addEventListener('click', toggleFullscreen);

      document.addEventListener('fullscreenchange', () => {
        btnFullscreen.classList.toggle('active', !!document.fullscreenElement);
      });

      // ── TECLADO ──
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const key = e.key.toLowerCase();
        if (key === 'm') {
          e.preventDefault();
          setMuteState(!isMuted);
          wakeHud();
        } else if (key === 'f') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 'c') {
          e.preventDefault();
          btnCrt.click();
          wakeHud();
        } else if (e.code === 'Space' || key === 'k') {
          e.preventDefault();
          togglePlayPause();
          wakeHud();
        }
      });

      // ── YOUTUBE API ──
      function loadYouTubeAPI(callback) {
        if (window.YT && window.YT.Player) {
          ytReady = true;
          callback();
          return;
        }
        window.onYouTubeIframeAPIReady = function () {
          ytReady = true;
          callback();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        const first = document.getElementsByTagName('script')[0];
        first.parentNode.insertBefore(tag, first);
      }

      function initYouTubeLiveStream(unmuteInitial = false) {
        loadYouTubeAPI(() => {
          ytPlayer = new YT.Player('tv-youtube-player', {
            height: '100%',
            width: '100%',
            videoId: YOUTUBE_STREAM_ID,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              modestbranding: 1,
              rel: 0,
              iv_load_policy: 3,
              cc_load_policy: 0,
              playsinline: 1,
              enablejsapi: 1,
              origin: window.location.origin
            },
            events: {
              onReady: function (event) {
                if (unmuteInitial) {
                  setMuteState(false, 0.65);
                } else {
                  setMuteState(true);
                }
                event.target.playVideo();
                isPlaying = true;
                updatePlayPauseIcon(true);
              },
              onStateChange: function (event) {
                if (event.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  updatePlayPauseIcon(true);
                } else if (event.data === YT.PlayerState.PAUSED) {
                  isPlaying = false;
                  updatePlayPauseIcon(false);
                } else if (event.data === YT.PlayerState.ENDED) {
                  // Si el directo finaliza o reconecta, reintentar reproducción
                  setTimeout(() => {
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                      ytPlayer.playVideo();
                    }
                  }, 4000);
                }
              },
              onError: function (event) {
                console.warn('YouTube Stream status/error:', event.data);
                // Reintento en caso de hipo de conexión
                setTimeout(() => {
                  if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                  }
                }, 5000);
              }
            }
          });
        });
      }

      // ── INTRO CINEMÁTICA ──
      function playTVIntroSequence(onFinished) {
        const introEl = document.getElementById('tvIntro');
        const video = document.getElementById('tvIntroVideo');

        if (!introEl || !video) {
          if (onFinished) onFinished(false);
          return;
        }

        let completed = false;
        let userUnmuted = false;

        function finish() {
          if (completed) return;
          completed = true;

          window.removeEventListener('keydown', onKeyDown);
          introEl.removeEventListener('pointerdown', onScreenInteraction);
          video.onended = null;
          video.onerror = null;

          introEl.style.opacity = '0';
          introEl.style.pointerEvents = 'none';

          setTimeout(() => {
            try {
              video.pause();
              video.currentTime = 0;
            } catch (e) {}
            introEl.style.display = 'none';
            if (typeof onFinished === 'function') onFinished(userUnmuted);
          }, 450);
        }

        function onKeyDown(e) {
          if (e.key === 'Escape' || e.code === 'Space') {
            e.preventDefault();
            finish();
          }
        }

        function onScreenInteraction() {
          if (video.muted) {
            video.muted = false;
            video.volume = 1.0;
            userUnmuted = true;
          }
        }

        window.addEventListener('keydown', onKeyDown);
        introEl.addEventListener('pointerdown', onScreenInteraction);

        video.onended = () => finish();
        video.onerror = (err) => {
          console.warn('TV Intro video error:', err);
          finish();
        };

        // Timeout máximo de seguridad
        setTimeout(() => {
          if (!completed) finish();
        }, 13000);

        try {
          video.currentTime = 0;
          video.volume = 1.0;
          video.muted = false;

          const playPromise = video.play();
          if (playPromise && playPromise.then) {
            playPromise.then(() => {
              userUnmuted = true;
            }).catch(() => {
              video.muted = true;
              video.play().catch(() => finish());
            });
          }
        } catch (err) {
          console.warn('TV Intro play error:', err);
          finish();
        }
      }

      function initTV() {
        playTVIntroSequence((unmuted) => {
          initYouTubeLiveStream(unmuted);
          wakeHud();
        });
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initTV);
      } else {
        initTV();
      }

    })();
  </script>
</body>
</html>
